<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amlaak REOS Explorer</title>
<meta name="description" content="Enterprise documentation explorer for the Amlaak Real Estate Operating System: five business cases, stakeholder journeys and data architecture.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23DFC42B'/%3E%3Cpath d='M0 21c6-2 18-3 32 1v10H0z' fill='%23005A50'/%3E%3Cpath d='M5 15c6-9 16-10 24-2' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm enterprise documentation for a board, analysts and delivery teams. Quiet surfaces, precise labels.
   IDEA: a documentation workspace. A fixed sidebar holds the sections and the five business cases; each opens as its own page.
   PICTURE: on Overview, the platform stack (five applications over the orchestration layer and the REOS core) drawn with hairline connectors.
   COLOUR and TYPE: warm neutral greys carry the page; Amlak Green #0C653A is the single accent (selection, links, primary roles); Amlak Gold appears only as a status tint. Inter at 13, 14.5, 18 and 28px.
   LAYOUT: 264px sidebar, content up to 1120px, one page header pattern, tables and property lists over decorative cards. Motion is limited to 150 to 200ms state changes. */
:root{color-scheme:light dark;
--bg:light-dark(#FFFFFF,#121413);--side:light-dark(#F8F8F6,#171918);--sub:light-dark(#FAFAF9,#181A19);--hover:light-dark(#F2F2EF,#202321);
--ink:light-dark(#1B1E1C,#ECEDEC);--ink2:light-dark(#3E4440,#C9CCCA);--mute:light-dark(#646B67,#959C98);
--line:light-dark(#E7E8E4,#262A28);--line2:light-dark(#D7D9D4,#333835);
--acc:light-dark(#0C653A,#5DBE8F);--accBg:light-dark(#EEF5F1,#17281F);--accLine:light-dark(#BFD8C9,#2B4D3B);
--gold:light-dark(#8A6D00,#E0C556);--goldBg:light-dark(#FBF6DF,#2A2615);--goldLine:light-dark(#EADA8E,#4D4520);
--fill:#0C653A;--r:10px;--r2:8px;--ease:cubic-bezier(.2,0,0,1);
--sh:0 1px 2px light-dark(rgb(16 24 20/.05),rgb(0 0 0/.3));--sh2:0 12px 32px -12px light-dark(rgb(16 24 20/.18),rgb(0 0 0/.6))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.011em;text-wrap:balance;line-height:1.3}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em}h2{font-size:18px}h3{font-size:15px}h4{font-size:14.5px}
p{margin:0;text-wrap:pretty}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
code{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);background:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--fill);color:#fff;padding:8px 12px;border-radius:8px;z-index:99}.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 263px,var(--line) 263px 264px,var(--bg) 264px)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;color:var(--ink)}
.brand svg{width:26px;height:27px;border-radius:4px}
.brand b{font-weight:600;font-size:14.5px;display:block;line-height:1.2}.brand small{color:var(--mute);font-size:12px}
.sfind{display:flex;align-items:center;gap:8px;margin:4px 12px 8px;padding:0 10px;height:36px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--mute);font-size:13.5px;text-align:left;transition:border-color .15s}
.sfind:hover{border-color:var(--line2)}.sfind span{flex:1}
kbd{font:500 11.5px Inter,sans-serif;color:var(--mute);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.navg{padding:8px 8px 4px}
.navg>p{font-size:12px;font-weight:500;color:var(--mute);padding:6px 8px}
.nl{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;min-height:34px;border:0;background:none;border-radius:6px;color:var(--ink2);font-size:14px;text-align:left;transition:background-color .15s,color .15s}
.nl:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.nl .ico{color:var(--mute)}
.nl[aria-current=page]{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.nl[aria-current=page] .ico{color:var(--acc)}
.bcn{display:inline-grid;place-items:center;min-width:30px;height:20px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--mute);font-variant-numeric:tabular-nums}
.nl[aria-current=page] .bcn{background:var(--accBg);color:var(--acc)}
.subnav{display:grid;margin:2px 0 6px 23px;padding-left:12px;border-left:1px solid var(--line2)}
.subnav a{padding:5px 8px;border-radius:6px;font-size:13.5px;color:var(--mute)}
.subnav a:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.subnav a[aria-current=true]{color:var(--acc);font-weight:500}
.sidefoot{margin-top:auto;padding:14px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);line-height:1.5}
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,40px);background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs .ico{width:14px;height:14px;opacity:.6}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r2);border:1px solid var(--line);background:var(--bg);color:var(--ink2);transition:background-color .15s,border-color .15s}
.ibtn:hover:not(:disabled){background:var(--hover);border-color:var(--line2)}.ibtn:disabled{opacity:.38;cursor:not-allowed}
.top .sfind{display:none;margin:0 0 0 auto}
.top .menu{display:none}
.scrim{display:none}
@media(max-width:600px){.crumbs>span:first-child,.crumbs>.ico:nth-child(2){display:none}}
@media(max-width:1023px){
 .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
 .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .22s var(--ease);box-shadow:var(--sh2)}
 .side.open{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(10 15 12/.35);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .scrim.open{opacity:1;pointer-events:auto}
 .top .menu{display:inline-grid}.top .sfind{display:flex;width:44px;justify-content:center;padding:0}.top .sfind span,.top .sfind kbd{display:none}}

/* page */
main{padding:clamp(24px,4vw,44px) clamp(16px,3vw,40px) 64px}
.page{max-width:1120px;margin:0 auto;animation:in .18s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.ph{padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.ph .pre{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-bottom:10px}
.ph .lead{color:var(--ink2);font-size:15.5px;max-width:76ch;margin-top:10px;line-height:1.6}
.ph .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sec{margin-top:40px}
.sec:first-child{margin-top:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sh p{color:var(--mute);font-size:13.5px;max-width:70ch}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);box-shadow:var(--sh)}
.muted{color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--sub);color:var(--ink2);white-space:nowrap;line-height:1.5}
.badge.acc{background:var(--accBg);border-color:var(--accLine);color:var(--acc)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--mute)}
.d-internal,.d-public{background:#9AA19D}.d-confidential{background:#3E9B6E}.d-financial{background:#0C653A}.d-restricted{background:#D4B227}.d-pii{background:#B5651D}
.pill{display:inline-flex;align-items:center;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--sub);border:1px solid var(--line);color:var(--ink2);line-height:1.45}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;padding:2px;border-radius:var(--r2);background:var(--hover);border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:6px;padding:5px 12px;font-size:13px;color:var(--mute);min-height:30px;transition:background-color .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:var(--sh)}
.fbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:13px;color:var(--ink2);transition:background-color .15s,border-color .15s}
.fbtn:hover{border-color:var(--line2);background:var(--sub)}
.fbtn[aria-pressed=true]{border-color:var(--accLine);background:var(--accBg);color:var(--acc);font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools .count{margin-left:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.inp{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--mute);flex:1 1 240px;max-width:340px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accBg)}
.inp input{border:0;outline:0;background:none;font:14px Inter,sans-serif;color:var(--ink);width:100%}
@media(max-width:600px){.inp input{font-size:16px}}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sub);font-size:14px;color:var(--ink2)}
.note .ico{margin-top:3px;color:var(--mute)}
.note.gold{background:var(--goldBg);border-color:var(--goldLine)}.note.gold .ico{color:var(--gold)}
.note b{color:var(--ink);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--mute);font-size:14px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;font-size:12.5px;color:var(--mute);background:var(--sub);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .15s}tbody tr:hover td{background:var(--sub)}
td.k{color:var(--ink);font-weight:500}
@media(max-width:700px){.stack thead{display:none}.stack tr{display:grid;padding:10px 14px;border-bottom:1px solid var(--line)}.stack tr:last-child{border-bottom:0}.stack td{display:flow-root;border:0;padding:3px 0 3px 8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:12.5px;white-space:normal}.stack td:empty{display:none}.stack tbody tr:hover td{background:none}}

/* property list */
.props{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.props>div{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
.props>div:nth-last-child(-n+2){border-bottom:0}
.props .pk{display:flex;gap:8px;align-items:flex-start;color:var(--mute);background:var(--sub);border-right:1px solid var(--line);font-size:13.5px}
.props .pk .ico{margin-top:3px}
.props .pv{color:var(--ink2)}
@media(max-width:700px){.props{grid-template-columns:minmax(0,1fr)}.props .pk{border-right:0;border-bottom:0;padding-bottom:2px}.props>div:nth-last-child(2){border-bottom:0}}

/* overview */
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.metrics a{display:block;padding:16px 18px;border-right:1px solid var(--line);color:var(--ink);transition:background-color .15s}
.metrics a:last-child{border-right:0}
.metrics a:hover{background:var(--sub);text-decoration:none}
.metrics b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.metrics span{font-size:13px;color:var(--mute)}
@media(max-width:760px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics a{border-bottom:1px solid var(--line)}.metrics a:nth-child(2n){border-right:0}.metrics a:last-child{grid-column:span 2;border-bottom:0}}
.stackd{padding:24px;background:var(--sub);border:1px solid var(--line);border-radius:var(--r)}
.apps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.appc{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s}
.appc:hover{border-color:var(--accLine);box-shadow:var(--sh2);text-decoration:none}
.appc .t{display:flex;justify-content:space-between;align-items:center;color:var(--mute);margin-bottom:6px}
.appc h3{font-size:14.5px}.appc p{font-size:13px;color:var(--mute);line-height:1.45}
.appc::after{content:"";position:absolute;left:50%;bottom:-21px;height:20px;border-left:1px solid var(--line2)}
.rail{position:relative;height:40px}
.rail::before{content:"";position:absolute;top:20px;left:10%;right:10%;border-top:1px solid var(--line2)}
.rail::after{content:"";position:absolute;top:20px;left:50%;height:20px;border-left:1px solid var(--line2)}
.lyr{position:relative;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.lyr h4{font-size:13.5px;font-weight:600}.lyr p{font-size:13px;color:var(--mute);margin-top:2px}
.lyr .pills{margin-top:10px}.lyr .pill{font-size:12.5px;padding:2px 8px}
.lyr.core{border-color:var(--accLine);background:var(--accBg)}
.lyr.core h4{color:var(--acc)}.lyr.core .pill{background:var(--bg);border-color:var(--accLine)}
.stem{height:20px;margin-left:50%;border-left:1px solid var(--line2)}
@media(max-width:900px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))}.apps .appc:last-child{grid-column:span 2}.appc::after,.rail::before,.rail::after{display:none}.rail{height:16px}}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px}
@media(max-width:960px){.two{grid-template-columns:minmax(0,1fr)}}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.plist li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;color:var(--ink2)}
.plist li .ico{margin-top:4px;color:var(--acc)}
.links{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.links a{display:grid;grid-template-columns:auto minmax(0,1fr) 16px;gap:12px;align-items:start;padding:13px 14px;border-bottom:1px solid var(--line);color:var(--ink);transition:background-color .15s}
.links a:last-child{border-bottom:0}
.links a:hover{background:var(--sub);text-decoration:none}
.links a .ico{color:var(--mute);margin-top:3px}
.links b{font-weight:500;display:block}.links small{color:var(--mute);font-size:13px;line-height:1.5;display:block;margin-top:2px}

/* architecture */
.archg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:1100px){.archg{grid-template-columns:minmax(0,1fr)}}
.tier{display:grid;grid-template-columns:170px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden}
.tier+.tier{margin-top:10px}
.tier .tl{padding:14px;background:var(--sub);border-right:1px solid var(--line)}
.tier .tl b{display:block;font-weight:600;font-size:13.5px}.tier .tl small{color:var(--mute);font-size:12.5px;line-height:1.45;display:block;margin-top:2px}
.tier.t0 .tl b{color:var(--acc)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:10px}
.cell{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r2);padding:10px 12px;font-size:13.5px;line-height:1.4;color:var(--ink);transition:border-color .15s,background-color .15s}
.cell small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
.cell:hover{border-color:var(--line2);background:var(--sub)}
.cell[aria-pressed=true]{border-color:var(--acc);background:var(--accBg);box-shadow:inset 0 0 0 1px var(--acc)}
@media(max-width:700px){.tier{grid-template-columns:minmax(0,1fr)}.tier .tl{border-right:0;border-bottom:1px solid var(--line)}}
.dpanel{position:sticky;top:76px;padding:18px}
.dpanel .lab{font-size:12.5px;color:var(--mute);margin:14px 0 4px}
.dpanel .lab:first-child{margin-top:0}
.dpanel h3{font-size:16px}
.dpanel p{font-size:14px;color:var(--ink2)}

/* matrix */
.mx{min-width:680px}
.mx thead th{text-align:center;vertical-align:bottom;white-space:normal;padding:10px 8px}
.mx thead th:first-child{text-align:left;padding-left:14px}
.mx thead button{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--ink2);font-size:12.5px;font-weight:500;line-height:1.35}
.mx thead button:hover{background:var(--hover);color:var(--acc)}
.mx thead button b{display:block;color:var(--mute);font-weight:500}
.mx td{text-align:center;padding:7px 8px}
.mx tbody th{position:sticky;left:0;z-index:1;background:var(--bg);color:var(--ink);font-size:13.5px;font-weight:400;white-space:normal;min-width:220px;padding:9px 14px;border-bottom:1px solid var(--line)}
.mx tbody tr:hover th{background:var(--sub)}
.c{display:inline-grid;place-items:center;width:34px;height:24px;border-radius:6px;font-size:12px;font-weight:600;transition:opacity .2s}
.cP{background:var(--fill);color:#fff}.cS{background:var(--accBg);color:var(--acc);box-shadow:inset 0 0 0 1px var(--accLine)}
.cI{background:var(--hover);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}.cR{background:var(--goldBg);color:var(--gold);box-shadow:inset 0 0 0 1px var(--goldLine)}.cN{color:var(--line2)}
.mx.filt .c:not(.on){opacity:.18}
.mx tfoot td,.mx tfoot th{background:var(--sub);font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mx tfoot th{position:sticky;left:0;font-weight:500;text-align:left;padding-left:14px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.dl>div{padding:14px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.dl>div:nth-child(2n){border-right:0}
.dl b{display:block;font-weight:500;color:var(--ink);font-size:14px}.dl p{font-size:13.5px;color:var(--mute);margin-top:3px}
@media(max-width:800px){.dl{grid-template-columns:minmax(0,1fr)}.dl>div{border-right:0}}

/* business case */
.bchead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:32px 0 20px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;background:none;padding:10px 12px;min-height:44px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);font-weight:500;border-bottom-color:var(--acc)}
.tab[aria-selected=true] .ico{color:var(--acc)}
.tab .n{font-size:12px;color:var(--mute);background:var(--hover);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}

/* journey */
.jg{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:960px){.jg{grid-template-columns:minmax(0,1fr)}}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:21px;top:30px;bottom:-6px;border-left:1px solid var(--line2)}
.steps li.done::before{border-color:var(--accLine)}
.st{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:8px 8px;border-radius:var(--r2);transition:background-color .15s}
.st:hover{background:var(--hover)}
.st .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums;transition:background-color .15s,border-color .15s,color .15s}
.steps li.done .num{border-color:var(--accLine);color:var(--acc)}
.st b{display:block;font-weight:500;font-size:14px;color:var(--ink2);line-height:1.35;margin-top:3px}
.st small{display:block;font-size:12.5px;color:var(--mute);line-height:1.4;margin-top:1px}
.st[aria-selected=true]{background:var(--accBg)}
.st[aria-selected=true] .num{background:var(--fill);border-color:var(--fill);color:#fff}
.st[aria-selected=true] b{color:var(--ink)}
.sd{position:sticky;top:76px;overflow:hidden;scroll-margin-top:68px}
@media(max-width:960px){.sd{position:static}}
.sd-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.sd-h .pos{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.sd-h h2{margin-top:2px}
.sd-h .pn{display:flex;gap:6px}
.sd .props{border:0;border-radius:0}
.sd .props .pv.ctl{background:var(--goldBg);color:var(--ink)}
.sd .props .pk.ctl{background:var(--goldBg)}
.sd .props .pk.ctl .ico{color:var(--gold)}
.jx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:24px}
@media(max-width:900px){.jx{grid-template-columns:minmax(0,1fr)}}
.jx .panel{padding:18px 20px}
.jx h3{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.jx h3 .ico{color:var(--mute)}
.exc{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.exc li{font-size:14px;color:var(--ink2);padding-left:14px;position:relative}
.exc li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:#D4B227}
.exc b{color:var(--ink);font-weight:500}
.kpi{list-style:none;margin:0;padding:0;display:grid;gap:0}
.kpi li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.kpi li:last-child{border-bottom:0}.kpi .ico{color:var(--acc)}

/* expandable rows */
.rows{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden}
.rh,.rb{display:grid;gap:14px;align-items:center;padding:0 14px}
.rh{font-size:12.5px;font-weight:500;color:var(--mute);background:var(--sub);border-bottom:1px solid var(--line);height:38px}
.ri{border-bottom:1px solid var(--line)}.ri:last-child{border-bottom:0}
.rb{width:100%;border:0;background:none;text-align:left;min-height:52px;padding-block:10px;transition:background-color .15s}
.rb:hover{background:var(--sub)}
.rb .k{font-weight:500;color:var(--ink)}
.rb .v{font-size:13.5px;color:var(--ink2)}
.rb .chev{color:var(--mute);transition:transform .2s var(--ease)}
.ri.open>.rb{background:var(--sub)}
.ri.open>.rb .chev{transform:rotate(180deg)}
.rx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s var(--ease)}
.ri.open .rx{grid-template-rows:1fr}
.rx>div{overflow:hidden}
.rx .in{padding:4px 14px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px;background:var(--sub)}
.rx .in .w{grid-column:1/-1}
.rx .lab{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.rx p{font-size:14px;color:var(--ink2)}
.tgs{display:flex;flex-wrap:wrap;gap:6px}
.g-sh{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.3fr) 18px}
.g-dp{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) 18px}
@media(max-width:760px){.rh{display:none}.g-sh,.g-dp{grid-template-columns:minmax(0,1fr) 18px}.rb>.hide{display:none}.rb .tgs{grid-column:1;order:3}.rb .chev{grid-row:1;grid-column:2}.rx .in{grid-template-columns:minmax(0,1fr)}}
.shg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:1180px){.shg{grid-template-columns:minmax(0,1fr)}}
.cov{padding:18px;position:sticky;top:76px}
.cov h3{margin-bottom:4px}.cov>p{font-size:13px;color:var(--mute);margin-bottom:6px}
.cov .grp{margin-top:14px}
.cov .gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:6px}
.cov ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13.5px;color:var(--ink2)}
.cov .c{width:26px;height:20px;font-size:11px}

/* data lifecycle */
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:20px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--sub)}
.fn{position:relative;padding:12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);box-shadow:var(--sh)}
.fn .i{font-size:11.5px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums}
.fn b{display:block;font-weight:500;font-size:13.5px;line-height:1.3;margin:2px 0 4px}
.fn span{display:block;font-size:12.5px;color:var(--mute);line-height:1.4}
.fn:not(:last-child)::after{content:"";position:absolute;top:50%;right:-15px;width:10px;border-top:1px solid var(--line2)}
.fn:not(:last-child)::before{content:"";position:absolute;top:calc(50% - 3px);right:-16px;width:5px;height:5px;border-top:1px solid var(--line2);border-right:1px solid var(--line2);transform:rotate(45deg)}
@media(max-width:1180px){.flow{grid-template-columns:repeat(4,minmax(0,1fr))}.fn:nth-child(4)::after,.fn:nth-child(4)::before{display:none}}
@media(max-width:600px){.flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px}.fn:nth-child(2n)::after,.fn:nth-child(2n)::before{display:none}.fn::after{right:-12px!important;width:8px!important}.fn::before{right:-13px!important}}
.sharedsvc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
.ctrl{list-style:none;margin:0;padding:0;display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.ctrl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.ctrl li:last-child{border-bottom:0}.ctrl .ico{margin-top:3px;color:var(--acc)}

/* governance and rollout */
.raci td:nth-child(2){color:var(--acc);font-weight:500}
.acc2{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.acc2 .ri .rb{grid-template-columns:minmax(0,1fr) auto 18px}
.acc2 ul{margin:0;padding:4px 18px 16px 34px;display:grid;gap:6px;font-size:14px;color:var(--ink2);background:var(--sub)}
.wtl{list-style:none;margin:0;padding:0;position:relative}
.wtl li{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:16px;padding-bottom:22px}
.wtl li:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:4px;border-left:1px solid var(--line2)}
.wtl .num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--accLine);background:var(--accBg);color:var(--acc);font-weight:600;font-size:13px}
.wtl h3{margin-top:6px}.wtl .pills{margin:8px 0}.wtl .pill{font-size:12.5px;padding:1px 8px}
.wtl p{font-size:14px;color:var(--ink2)}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:10px}
.track span{position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);font-weight:500}
.track i{width:10px;height:10px;border-radius:50%;border:2px solid var(--acc);background:var(--bg);flex:none}
.track span:first-child i{background:var(--acc)}
.track span:not(:last-child)::after{content:"";flex:1;border-top:1px solid var(--line2);margin-right:-12px}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ph2{display:flex;flex-direction:column;overflow:hidden}
.ph2 .hd{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.ph2 .hd small{font-size:12.5px;color:var(--acc);font-weight:500}
.ph2 .hd h3{font-size:15.5px;margin-top:2px}
.ph2 .hd p{font-size:13.5px;color:var(--ink2);margin-top:6px}
.ph2 .b{padding:12px 16px;border-bottom:1px solid var(--line)}
.ph2 .b:last-child{border-bottom:0;margin-top:auto;background:var(--sub)}
.ph2 .lab{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.ph2 .b p{font-size:13.5px;color:var(--ink2)}
@media(max-width:1100px){.road,.track{grid-template-columns:repeat(2,minmax(0,1fr))}.track span:nth-child(2)::after{display:none}}
@media(max-width:600px){.road{grid-template-columns:minmax(0,1fr)}.track{display:none}}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:14px;color:var(--ink2)}
.checks li:nth-child(2n){border-right:0}.checks .ico{margin-top:3px;color:var(--acc)}
@media(max-width:760px){.checks{grid-template-columns:minmax(0,1fr)}.checks li{border-right:0}}
.asm{margin:0;padding-left:20px;display:grid;gap:10px;color:var(--ink2)}

/* pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);color:var(--ink);transition:border-color .15s,background-color .15s}
.pager a:hover{border-color:var(--line2);background:var(--sub);text-decoration:none}
.pager small{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.pager b{font-weight:500}
.pager .nx{text-align:right;align-items:flex-end;grid-column:2}

/* search dialog */
dialog{border:1px solid var(--line);padding:0;border-radius:12px;width:min(640px,calc(100vw - 24px));max-height:min(580px,calc(100dvh - 80px));margin-top:10vh;background:var(--bg);color:var(--ink);box-shadow:var(--sh2);overscroll-behavior:contain}
dialog::backdrop{background:rgb(10 15 12/.32)}
dialog[open]{display:flex;flex-direction:column;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.985)}}
.dh{display:flex;gap:10px;align-items:center;padding:0 14px;height:52px;border-bottom:1px solid var(--line)}
.dh input{flex:1;border:0;outline:0;background:none;font:15.5px Inter,sans-serif;color:var(--ink)}
@media(max-width:600px){.dh input{font-size:16px}}
.dh .ico{color:var(--mute)}
.res{overflow-y:auto;padding:6px;list-style:none;margin:0}
.res button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:var(--r2)}
.res button[aria-selected=true],.res button:hover{background:var(--hover)}
.res b{font-weight:500;font-size:14px}
.res .ty{font-size:12px;color:var(--mute);white-space:nowrap}
.res small{grid-column:1/-1;color:var(--mute);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:var(--goldBg);color:inherit;border-radius:3px;padding:0 1px}
.dfoot{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);background:var(--sub)}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,35%{box-shadow:0 0 0 2px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

<script type="application/json" id="reos">{"clientScope":"This document is exclusively focused on Amlaak's Real Estate Operating System (REOS) and the five selected real-estate business cases. It is based on the previously developed architecture mapping and the November 20, 2026 Amlaak internal meeting minutes. It is a detailed working architecture for client discussion; legal, regulatory, data-access and partner-specific requirements must be confirmed before implementation.","summary":["Amlaak REOS is a real-estate-focused operating environment. The five selected business cases are distinct customer and operating applications that share property identity, participant identity, trust and compliance, documents, workflow, wallet, ledger, payments, settlement, audit, data and partner integration services. These shared capabilities are implemented once within the REOS foundation and composed into the five real-estate journeys.","The Real Estate Services & Orchestration Layer provides property-specific records and workflows: property identity, title/registry references, ownership authority, valuation, collateral, listings, tenancy and property lifecycle. The Property Portal owns discovery and lead conversion; it does not become the authoritative property ownership registry.","The Tokenized Property Platform manages a property or property-holding vehicle offering and the lifecycle of tokens representing legally defined rights. Real Estate Investment Products & Fund Management manages pooled property vehicles, investor registers, portfolios, NAV, fees, distributions and redemptions. A fund may invest in tokenized property, but fund units, property tokens and legal title remain distinct records.","The Lending Operating System supports real-estate financing journeys such as mortgages, home finance, developer finance and property-backed lending. It orchestrates applications, evidence, underwriting workflows, approvals, contracts, disbursement and servicing; the appointed lender remains the lender of record and owns credit policy and final credit decisions unless a separately approved arrangement states otherwise.","Strategic Real Estate Capital & Market Making manages capital mandates and allocations into property assets, development projects, property vehicles and eligible property-backed instruments. Any market-making or trading activity applies only to permitted financial instruments and must be performed by appropriately authorized partners; it is not a trading order book for physical property title."],"structure":[{"section":"2. REOS portfolio boundary & shared services","contents":"Five real-estate applications vs shared REOS foundation vs external real-estate ecosystem; data ownership rules."},{"section":"3. Amlaak real-estate stakeholder map","contents":"Stakeholder coverage visual and common real-estate stakeholder responsibilities."},{"section":"4 to 8. Real-estate business case details","contents":"Stakeholder mapping, primary user journey, detailed stages, data-flow visual, data point catalogue, controls, integrations and KPIs for each selected case."},{"section":"9. Shared real-estate data architecture","contents":"Shared property/party/transaction domains, source-of-truth ownership, sensitivity, events and reconciliation."},{"section":"10 to 12. Ownership, decisions and validation","contents":"Proposed RACI, Amlaak decisions to validate and recommended validation workshop sequence."},{"section":"Appendix","contents":"Glossary, assumptions and limitations."}],"ownership":[{"domain":"Identity, organization, SSO, MFA, RBAC, consent","layer":"REOS Core Platform","rule":"Shared across the five Amlaak real-estate applications; permissions and purpose are configured per journey."},{"domain":"KYC/KYB, AML/sanctions, eligibility, risk controls","layer":"REOS Trust & Compliance","rule":"Reusable verification and status services; product-specific investor, borrower and counterparty rules remain in the relevant real-estate application."},{"domain":"Wallets, ledger, payment, settlement, reconciliation","layer":"REOS Transaction Services","rule":"Common transaction services; blockchain is not the internal accounting ledger and external cash movement must be reconciled."},{"domain":"Documents, notifications, audit, workflow, API/event bus, reporting","layer":"REOS Shared Services","rule":"Reusable evidence, communication, orchestration, partner interfaces and operational reporting."},{"domain":"Property master, parcel/unit, title reference and ownership evidence","layer":"REOS Property Registry","rule":"Maintains normalized property references and evidence; the official land/title registry remains authoritative for registered legal status."},{"domain":"Property, title/registry, valuation, collateral, tenancy and property lifecycle","layer":"Real Estate Services & Orchestration","rule":"Real-estate-specific records, rules, diligence and authorized DLD/RERA/Dubai REST integrations."},{"domain":"Listings, search, discovery, leads, viewings and offer intent","layer":"Property Portal Application","rule":"Portal owns discovery and conversion funnel; it is not the authoritative title registry or final conveyance record."},{"domain":"Loan product, application, underwriting workflow, loan account and servicing","layer":"Lending Operating System","rule":"Property finance lifecycle; lender remains decision owner and lender of record unless formally delegated."},{"domain":"Tokenization, token lifecycle, smart contracts, chain gateway and custody integration","layer":"Tokenized Property Services","rule":"Digital representation and lifecycle of legally approved property rights; legal title and investor register must be reconciled."},{"domain":"Issuer/offering, investor allocation and tokenized property lifecycle","layer":"Tokenized Property Platform","rule":"Property investment journey composed from REOS services and appointed issuer/custody/transfer-agent partners."},{"domain":"Capital mandate, property allocation, quotes, orders, trades, positions and risk","layer":"Strategic Real Estate Capital & Liquidity","rule":"Limited to property assets, development projects, property vehicles and eligible property-backed instruments; regulated execution via authorized partners."},{"domain":"Fund product, property classes, subscriptions, NAV, fund accounting and distributions","layer":"Real Estate Investment Products & Fund Management","rule":"Pooled property vehicle lifecycle; underlying assets may be direct property, SPVs or eligible tokenized property interests."},{"domain":"External registry, bank, PSP, custodian, venue, KYC, valuation and property-data providers","layer":"External real-estate ecosystem via REOS adapters","rule":"Partner-specific schemas, credentials, permissions and failure handling remain at the integration boundary."}],"guardrail":"The five Amlaak real-estate applications compose journeys through the REOS Services & Orchestration Layer and stable platform APIs/events. Property, lending, tokenization, capital and fund services own their real-estate-specific models and rules. Partner-specific schemas and credentials remain in adapters. The internal ledger is transaction/accounting truth; blockchain is an optional execution and representation layer. Official title, lender, fund and custody records retain their respective legal authority.","groups":[{"group":"Buyers / tenants / investors / borrowers / property seekers","role":"Initiate property and financing journeys, provide consented information, make decisions, transact and receive confirmations, statements and service outcomes. Access is least-privilege and purpose-based."},{"group":"Property owners / developers / asset sponsors","role":"Provide property facts, ownership authority, legal evidence, development information, economics, inventory and operating data."},{"group":"Brokers / distributors / advisors","role":"Acquire and qualify customers, introduce property and investment opportunities, support viewings and applications, maintain required authority and track referrals/disclosures."},{"group":"Banks / lenders / PSPs / escrow / settlement providers","role":"Execute financing, escrow, collections, payouts, repayments and settlement; provide confirmations and reconciliation evidence."},{"group":"Fund managers / administrators / transfer agents","role":"Own property product/fund configuration, investor register, allocations, NAV, fees, distributions, redemptions and reporting operations."},{"group":"Market makers / venues / liquidity providers","role":"Provide prices, quotes, orders, execution, liquidity and trade confirmations only for eligible property-backed instruments and within authorized mandates."},{"group":"Custodians / wallet providers / blockchain partners","role":"Safeguard assets/keys or execute network activity; provide balance, transaction status and reconciliation evidence."},{"group":"KYC/KYB/AML / credit / property-data providers","role":"Provide verification, screening, credit, valuation or property-data outputs through consented, controlled and versioned interfaces."},{"group":"Valuers / legal / auditors / technical providers","role":"Provide independent evidence, legal opinions, valuation, inspection, assurance and exception review."},{"group":"DLD / RERA / Dubai REST / official registry authorities","role":"Provide authorized property, title, permit or status evidence; remain authoritative external sources where applicable."},{"group":"Property managers / servicers / insurers / contractors","role":"Support property operations, occupancy, rent, expense, maintenance, insurance and lifecycle data."},{"group":"Amlaak operations / compliance / risk / support","role":"Manage queues, controls, exceptions, permissions, incidents, audit evidence, service quality, partner performance and reporting."},{"group":"Regulators / governance bodies","role":"Set or supervise applicable obligations; receive or review only authorized evidence and reporting."}],"coverage":[{"group":"Retail / HNWI / institutional investors","v":["P","S","S","S","P"]},{"group":"Property owners / developers / sponsors","v":["P","P","P","P","S"]},{"group":"Buyers / tenants / property seekers","v":["S","P","P","-","-"]},{"group":"Brokers / agents / distributors","v":["S","P","P","S","P"]},{"group":"Banks / lenders / credit funds","v":["S","S","P","S","S"]},{"group":"Fund managers / administrators / transfer agents","v":["S","-","S","P","P"]},{"group":"Strategic allocators / treasury / IC","v":["S","-","S","P","S"]},{"group":"Market makers / venues / brokers","v":["S","-","-","P","S"]},{"group":"Custodians / wallet providers","v":["P","I","I","P","P"]},{"group":"KYC / AML / sanctions providers","v":["P","I","P","P","P"]},{"group":"Valuers / legal / auditors","v":["P","I","P","P","P"]},{"group":"DLD / RERA / Dubai REST / property data","v":["P","P","P","I","P"]},{"group":"Payment / settlement providers","v":["P","I","P","P","P"]},{"group":"Property managers / asset servicers","v":["P","S","S","S","P"]},{"group":"Market data / pricing / analytics providers","v":["S","I","P","P","P"]},{"group":"Compliance / risk / operations / platform admin","v":["P","P","P","P","P"]},{"group":"Regulators / governance authorities","v":["R","R","R","R","R"]},{"group":"Insurance / protection providers","v":["S","I","S","S","S"]}],"cases":[{"id":1,"name":"Tokenized Property Platform","short":"Tokenized Property","tag":"Real Estate + Digital Asset","scope":"Onboard and diligence a property or property-holding vehicle; define legally approved property investment rights; onboard eligible investors; process subscriptions, token issuance, investor positions, permitted transfers and property cashflows.","title":"Tokenized Property Platform","purpose":"Onboard and diligence a property or property vehicle; structure an investment offering; enable compliant investor onboarding, subscription, token issuance, ownership/position management, transfers and lifecycle cashflows.","boundary":"Property facts and legal rights are validated through REOS Real Estate Services / approved external registry integrations. Token issuance, wallets, ledger, payment and settlement use Core OS services. The token is a digital representation of approved rights; legal title and registry status must be reconciled to the applicable authoritative record.","interp":null,"stakeholders":[{"role":"Property owner / developer / asset sponsor","goal":"Originates the asset or contributes it to a vehicle; supplies title, financial, operating and diligence records.","touchpoints":"Asset onboarding, document submission, approvals, ongoing reporting","system":"External asset owner; property record in REOS Real Estate Services","data":"Asset, title, financials, property documents","access":"Confidential / Restricted"},{"role":"Issuer / SPV / authorized manager","goal":"Defines the legal issuer, offering structure, rights, economics and governance.","touchpoints":"Entity verification, structure, terms, issuance approvals, corporate actions","system":"Issuer / product record (industry module)","data":"Issuer, SPV, offering terms, cap table","access":"Confidential"},{"role":"Retail / HNWI / institutional investor","goal":"Reviews offer, verifies identity and eligibility, subscribes, holds/transfers and receives reporting/distributions.","touchpoints":"Investor onboarding, eligibility, subscription, wallet, statements","system":"Core Identity + investor/product records","data":"Identity, suitability, orders, positions, payments","access":"Restricted / Financial"},{"role":"Distributor / broker / wealth advisor","goal":"Introduces investors, supports suitability and subscription and tracks referral/commission.","touchpoints":"Offering discovery, lead, investor referral, subscription status","system":"Distribution CRM / offering record","data":"Referral, investor, commission, consent","access":"Confidential"},{"role":"Property manager / asset servicer","goal":"Reports rent, operating costs, occupancy, maintenance and distributable cashflows.","touchpoints":"Asset operations, cashflow, distribution input, reporting","system":"REOS Real Estate Services / servicer system","data":"Rent roll, expenses, occupancy, cashflow","access":"Confidential"},{"role":"Valuer / technical inspector","goal":"Provides independent valuation, inspection and condition evidence.","touchpoints":"Valuation, inspection, update/revaluation","system":"Valuation record + document repository","data":"Valuation report, methodology, assumptions","access":"Confidential"},{"role":"Legal counsel / auditor / Sharia or governance board (if applicable)","goal":"Reviews legal structure, disclosures, rights, controls and evidence.","touchpoints":"Diligence, terms review, approval, audit","system":"Document / case / audit services","data":"Legal opinions, disclosure, approvals, evidence","access":"Restricted"},{"role":"KYC/KYB / AML / sanctions provider","goal":"Verifies investors, issuer entities and risk screening.","touchpoints":"Identity verification, screening, ongoing monitoring","system":"Core Trust services; provider adapter","data":"Verification result, risk status, screening references","access":"Restricted / PII"},{"role":"Bank / payment provider / escrow agent","goal":"Receives subscription funds and executes payouts/distributions.","touchpoints":"Funding, escrow, refunds, distributions, reconciliation","system":"Core Payment / Settlement + partner records","data":"Payment instructions, confirmations, balances","access":"Financial"},{"role":"Custodian / wallet provider / blockchain network","goal":"Safeguards keys or assets and executes/reports on-chain activity.","touchpoints":"Wallet provisioning, signing, transfer, event confirmation","system":"Wallet/Custody service + chain indexer","data":"Wallet, address, tx hash, token position","access":"Restricted / Financial"},{"role":"DLD / RERA / Dubai REST / relevant registry (jurisdiction dependent)","goal":"Provides official property/title/permit references or status where authorized.","touchpoints":"Registry verification, status check, update/reconciliation","system":"External authoritative registry","data":"Registry reference, title, permit, status","access":"Restricted"},{"role":"Platform operations / compliance / regulator","goal":"Controls issuance and transfer policies, exceptions, monitoring and evidence.","touchpoints":"Case management, approval, monitoring, audit, reporting","system":"Core OS workflow, compliance, audit","data":"Workflow, policy decisions, audit evidence","access":"Restricted"}],"journey":[{"stage":"Asset intake","actor":"Owner / sponsor","action":"Submit asset, ownership, issuer and operating information; create onboarding case.","services":"Asset Registry, Documents, Organization","io":"Asset ID; entity; title refs; source docs","control":"Required fields and entity authorization complete; case ID issued."},{"stage":"Issuer / SPV verification","actor":"Issuer / Compliance","action":"Verify issuer, beneficial owners, authority, jurisdiction and account relationships.","services":"IAM, KYB, AML, Organization","io":"Issuer profile, UBOs, KYB results, authority docs","control":"KYB and sanctions decision; unresolved exceptions block progression."},{"stage":"Property diligence","actor":"Asset team / legal / registry","action":"Verify title/registry reference, encumbrances, valuation, condition, income and material risks.","services":"Property Registry, Integration, Case Mgmt, Documents","io":"Title, property attributes, valuation, diligence findings","control":"Diligence checklist approved; registry conflicts escalated."},{"stage":"Structure and rights","actor":"Issuer / legal / product","action":"Select vehicle/structure and define investor rights, economic terms, fees, restrictions and lifecycle rules.","services":"Product/Offering, Rules, Documents","io":"Vehicle, rights, economics, fees, transfer restrictions","control":"Versioned terms; legal/governance approval required."},{"stage":"Offering approval","actor":"Compliance / governance","action":"Review disclosure, eligibility, jurisdiction, marketing and issuance limits.","services":"Compliance, Eligibility, Workflow, Audit","io":"Offering pack, risk, approvals, restrictions","control":"Offering status changes to Approved/Published only after all controls."},{"stage":"Investor onboarding","actor":"Investor / platform","action":"Create account, complete KYC/AML, consent, suitability and wallet setup.","services":"IAM, Trust, Consent, Wallet","io":"Investor, KYC status, risk, suitability, wallet","control":"Eligible investor status; privacy/consent captured."},{"stage":"Subscription & funding","actor":"Investor / bank / PSP","action":"Place order, accept terms, transfer funds and receive payment/escrow confirmation.","services":"Order, Payment, Ledger, Settlement","io":"Subscription, amount, currency, payment ref","control":"Order valid; funds confirmed or escrowed; idempotent payment."},{"stage":"Allocation & issuance","actor":"Issuer / platform / custodian","action":"Allocate approved amount, mint/issue tokens and record investor position.","services":"Tokenization, Smart Contract, Ledger, Custody","io":"Allocation, token ID, supply, tx hash, position","control":"Supply/allocations reconcile; issuer approval and signing policy pass."},{"stage":"Register & confirmation","actor":"Platform / investor","action":"Update internal investor register and reconcile chain, ledger and official legal records as applicable.","services":"Investor Register, Chain Indexer, Audit","io":"Position, chain event, ledger posting, registry ref","control":"Three-way reconciliation exception queue; confirmation generated."},{"stage":"Lifecycle operations","actor":"Servicer / issuer / investor","action":"Manage income, fees, valuation updates, corporate actions, transfers, redemption and reporting.","services":"Asset Services, Payment, Transfer, Reporting","io":"Cashflows, NAV/valuation, transfer, distributions","control":"Policy checks, notices, approvals, settlement and audit trail."}],"exceptions":["Registry/title conflict or diligence exception: suspend offering setup; create case; require legal/asset-owner resolution and re-verification.","Investor ineligible, KYC fail or restricted jurisdiction: block subscription/transfer; preserve decision and allow authorized review only.","Payment fails or issuance/chain transaction is delayed: keep order in a durable pending state; retry idempotently or refund/cancel under approved rules.","Mismatch between token supply, register, ledger, bank or registry: quarantine affected operation and reconcile before declaring final."],"kpis":["Asset onboarding cycle time","Diligence completion and exception rate","Investor onboarding conversion / time","Subscription-to-issuance time","Reconciliation breaks and time to resolve","Distribution accuracy / on-time rate","Transfer and redemption processing time"],"lifecycle":[{"t":"Property & title","s":"Registry / owner evidence"},{"t":"Diligence & valuation","s":"Legal, technical & value"},{"t":"Issuer / offering","s":"Issuer, rights, economics"},{"t":"Investor & eligibility","s":"KYC, risk, consent"},{"t":"Subscription & funds","s":"Order, bank / escrow"},{"t":"Token / position","s":"Token ID, contract, position"},{"t":"Lifecycle cashflows","s":"Rent, fees, distributions"},{"t":"Reconciliation & audit","s":"Ledger, chain, registry"}],"datapoints":[{"entity":"Property / asset record","attributes":"property_id, registry_ref, parcel/unit, address/geo, type, area, ownership reference, status","source":"Owner, Real Estate registry, DLD/REST (authorized)","sor":"Real Estate Asset Registry","owner":"Asset data owner","sensitivity":"Confidential","event":"property.verified / asset.updated"},{"entity":"Title & registry evidence","attributes":"title_deed_ref, owner_ref, permit_ref, encumbrance, registry_status, verification_time","source":"Official registry / owner evidence","sor":"External registry; evidence stored in document service","owner":"Legal / registry integration owner","sensitivity":"Restricted","event":"registry.status.updated"},{"entity":"Valuation & inspection","attributes":"valuation_id, value, currency, date, methodology, valuer, assumptions, condition rating","source":"Independent valuer / data provider","sor":"Valuation record + document repository","owner":"Asset/valuation owner","sensitivity":"Confidential","event":"valuation.updated"},{"entity":"Due diligence case","attributes":"checklist, risk findings, exceptions, evidence, reviewer, decision","source":"Legal, technical, asset team","sor":"Workflow case / diligence record","owner":"Asset onboarding ops","sensitivity":"Restricted","event":"diligence.completed"},{"entity":"Issuer / SPV","attributes":"issuer_id, legal_name, jurisdiction, UBOs, authority, accounts, status","source":"Issuer and corporate registry","sor":"Organization / issuer record","owner":"Issuer operations","sensitivity":"Restricted","event":"issuer.verified"},{"entity":"Offering / product terms","attributes":"offering_id, rights, structure, target, min/max, price, fees, duration, restrictions, disclosures, version","source":"Issuer, legal, product owner","sor":"Offering/product module","owner":"Product owner / issuer","sensitivity":"Confidential","event":"offering.approved / offering.published"},{"entity":"Investor & verification","attributes":"investor_id, identity attributes, KYC/KYB status, screening refs, risk, suitability, consent","source":"Investor / KYC providers","sor":"Core Identity + Trust status","owner":"Compliance / identity owner","sensitivity":"Restricted / PII","event":"investor.verified"},{"entity":"Eligibility & transfer policy","attributes":"jurisdiction, investor type, limits, whitelist, lock-up, restriction reason, expiry","source":"Compliance policy / product terms","sor":"Core Rules / Compliance","owner":"Compliance","sensitivity":"Restricted","event":"eligibility.checked / policy.updat vent, bank ref, registry ref, mismatch, resolution, approvals, timestamps","source":"Core services, chain, bank, registry","sor":"Audit store / reconciliation","owner":"Operations / audit","sensitivity":"Restricted","event":"reconciliation.completed / exception.opened"}],"controls":["No issuance before property/issuer diligence and offering approval.","Investor eligibility and transfer restrictions are enforced by policy and service controls, not only UI.","Mint/burn, key signing and contract changes require controlled approvals and audit.","Token supply, internal ledger, investor register and chain events are reconciled; official legal ownership references are reconciled where applicable.","Cash distributions and refunds are calculated from approved records, then executed through payment/settlement rails."]},{"id":2,"name":"Property Portal","short":"Property Portal","tag":"Listings, discovery, leads","scope":"Aggregate, verify, enrich and publish residential, commercial, rental and development property inventory; enable discovery, comparison, enquiries, broker/developer engagement, viewings and transaction handoff.","title":"Property Portal","purpose":"Aggregate, verify, enrich and publish property inventory; enable discovery, comparison, leads, broker/developer engagement, viewings and offer/reservation handoff.","boundary":"The portal owns discovery experience, listing presentation, search, lead and engagement funnel. It is not the authoritative title registry. Property facts and regulatory status are verified against owner submissions and approved registry/data providers; transaction execution is handed to the appropriate real estate, lending or tokenized-property journey.","interp":null,"stakeholders":[{"role":"Buyer / tenant / property investor","goal":"Searches, compares, saves, contacts, schedules viewing and may submit offer/reservation intent.","touchpoints":"Search, shortlist, lead, viewing, offer","system":"Portal application / CRM funnel","data":"Preferences, search/engagement, contact consent","access":"Internal / PII"},{"role":"Seller / landlord / developer","goal":"Supplies listing inventory, price, availability, media and disclosure details.","touchpoints":"Listing create/update, lead response, offer management","system":"Portal listing record; source owner","data":"Listing, ownership/authority, pricing, availability","access":"Confidential"},{"role":"Broker / agent / brokerage","goal":"Creates/maintains listings, manages inquiries, viewings and client funnel.","touchpoints":"Broker onboarding, listing, lead assignment, viewing","system":"Portal CRM / broker profile","data":"Broker license/status, listings, leads, response metrics","access":"Confidential"},{"role":"Property manager","goal":"Updates availability, rent, occupancy, unit features and service status.","touchpoints":"Listing refresh, availability, inquiry support","system":"Property/asset source system","data":"Unit, availability, tenancy-related status","access":"Confidential"},{"role":"Listing verification / operations","goal":"Validates quality, duplicates, authorization, permits and publication rules.","touchpoints":"Moderation, verification, exception handling","system":"Portal operations case","data":"Listing evidence, verification checklist, status","access":"Internal / Restricted"},{"role":"DLD / RERA / Dubai REST / data sources","goal":"Provides approved property identifiers, status, permit or registry data.","touchpoints":"Verification, enrichment, sync","system":"External data source","data":"Property ref, permit/status, registry metadata","access":"Restricted"},{"role":"Valuers / data / media providers","goal":"Provide market data, comparable evidence, photography, floor plans and enrichment.","touchpoints":"Listing enrichment, price insight, content","system":"External provider / content store","data":"Comparables, valuation, media, metadata","access":"Confidential"},{"role":"Lenders / insurers / conveyancing / token platform","goal":"Receives qualified handoff for financing, protection or investment/transaction journeys.","touchpoints":"Referral/handoff, application link, status","system":"Partner CRM / linked journey","data":"Lead consent, property reference, buyer context","access":"Confidential"},{"role":"Marketing / analytics / customer support","goal":"Measures acquisition, engagement, conversion and supports user cases.","touchpoints":"Campaign, analytics, support","system":"Analytics/CRM/support","data":"Events, preferences, consent, case","access":"Internal / PII"},{"role":"Platform admin / privacy / compliance","goal":"Controls listing permissions, user access, consent, abuse and audit.","touchpoints":"Moderation, access, privacy, complaints","system":"Core OS + portal controls","data":"Audit, consent, access, abuse flags","access":"Restricted"}],"journey":[{"stage":"Inventory intake","actor":"Owner / developer / broker / feed","action":"Create listing manually, upload bulk inventory or submit partner feed.","services":"Portal listing, API connector, Documents","io":"Listing payload, source, property ref, media","control":"Source and submitter identified; schema/required fields validated."},{"stage":"Owner / broker verification","actor":"Portal operations / compliance","action":"Verify listing authority, owner/broker profile and required credentials.","services":"IAM, Organization, Trust, Case Mgmt","io":"Owner entity, broker license/status, authority docs","control":"Invalid/expired credentials block publishing or route to review."},{"stage":"Property & permit validation","actor":"Verification ops / registry connector","action":"Resolve property identity, duplicate listings and authorized registry/permit references.","services":"Real Estate Asset Registry, Integration","io":"Property ref, permit/status, unit/building, registry response","control":"Registry mismatch, duplicate or missing permit becomes exception."},{"stage":"Enrichment & media","actor":"Listing manager / data providers", rower / originator","action":"Complete application, co-borrowers/guarantors and consent for data access.","services":"Loan Application, Consent, Documents","io":"Application, parties, consent scopes","control":"Completeness validation; consent recorded by purpose."},{"stage":"Identity & compliance","actor":"KYC / lender compliance","action":"Verify identity/entity, AML/sanctions and required screening.","services":"IAM, Trust, Compliance","io":"KYC status, screening refs, risk","control":"Hard-stop or manual review for unresolved cases."},{"stage":"Financial data collection","actor":"Borrower / data provider","action":"Upload statements and documents or authorize secure data fetch.","services":"Document, Integration, Data Services","io":"Income, employment, statements, liabilities, credit","control":"Source provenance, period, freshness and consent validated."},{"stage":"Collateral & valuation","actor":"Lender / valuer / registry","action":"Identify collateral, verify title/ownership and order valuation/inspection.","services":"Property Registry, Valuation, Integration","io":"Property, title, encumbrance, value, condition","control":"Collateral accepted; discrepancies and stale valuations escalated."},{"stage":"Underwriting","actor":"Credit officer / rules engine","action":"Calculate risk, affordability, LTV/DTI, policy fit, pricing and exceptions.","services":"Rules, Risk, Workflow, Reporting","io":"Financial profile, collateral, product, score, exposure","control":"Decision rationale recorded; delegated authority limits enforced."},{"stage":"Offer & conditions","actor":"Lender / borrower","action":"Issue offer, pricing, fees, term, conditions; borrower accepts or declines.","services":"Offer, Documents, Notifications","io":"Offer version, conditions, acceptance","control":"Offer expiry, version and acceptance identity logged."},{"stage":"Contract & security","actor":"Legal / borrower / lender","action":"Execute loan, security, mortgage/pledge and required insurance documents.","services":"E-sign, Document, Case","io":"Agreement, security docs, insurance, evidence","control":"Required documents complete; legal/registry steps tracked."},{"stage":"Funding / disbursement","actor":"Lender / bank / settlement","action":"Confirm conditions, authorize disbursement, pay beneficiary and post loan balance.","services":"Payment, Ledger, Settlement","io":"Funding request, account, amount, loan posting","control":"Maker-checker; funding conditions; payment confirmation."},{"stage":"Servicing","actor":"Borrower / servicer","action":"Maintain schedule, statements, changes, payoff quote and customer requests.","services":"Loan Account, Notifications, Case","io":"Schedule, balance, rate, fees, status","control":"Changes authorized and recalculated with history."},{"stage":"Repayment / arrears","actor":"Borrower / servicer / collections","action":"Collect installment, reconcile, manage late/failed payments, hardship and collections.","services":"Payment, Ledger, Rules, Collections","io":"Payment, arrears, contact, collection action","control":"Retry/late fee rules; hardship and dispute controls; audit."},{"stage":"Payoff / collateral release","actor":"Borrower / lender / registry","action":"Calculate payoff, settle final amount, close account and release collateral.","services":"Settlement, Registry Integration, Documents","io":"Payoff, final ledger, release instructions","control":"Final balance zero/reconciled; release confirmation and closure."}],"exceptions":["Missing or inconsistent income/credit data: request documents or manual review; no silent default.","Collateral/title mismatch, stale valuation or unacceptable LTV/DTI: exception queue or decline under lender policy.","Approval conditions incomplete or payment fails: do not fund; preserve decision and allow authorized remediation.","Arrears, hardship or disputed payment: route to servicing/collections case and apply configured policy with human review."],"kpis":["Application completion rate","Prequalification response time","Underwriting turnaround time","Approval/decline and exception rates","Funding turnaround time","On-time repayment / arrears rates","Servicing cost per loan","Collateral release turnaround time"],"lifecycle":[{"t":"Borrower & consent","s":"Application, parties"},{"t":"Financial evidence","s":"Income, liabilities, consent"},{"t":"Property collateral","s":"Title, collateral, value"},{"t":"Credit / policy","s":"Score, policy, decision"},{"t":"Offer & contract","s":"Terms, conditions, signatures"},{"t":"Funding / loan account","s":"Payment, loan account"},{"t":"Servicing / payments","s":"Schedule, balance, receipts"},{"t":"Arrears / release","s":"Arrears, payoff, release"}],"datapoints":[{"entity":"Loan application","attributes":"application_id, product, requested_amount, term, purpose, channel, status, timestamps","source":"Borrower / originator","sor":"Lending application record","owner":"Origination ops","sensitivity":"Restricted","event":"application.created / updated"},{"entity":"Borrower / parties","attributes":"party_id, identity, household, co-borrower, guarantor, employer, contact","source":"Borrower / Core IAM","sor":"Core Identity + loan-party mapping","owner":"Identity / lender","sensitivity":"Restricted / PII","event":"party.verified"},{"entity":"Consent / authorization","attributes":"purpose, provider, scope, data category, time, expiry, revocation","source":"Borrower","sor":"Core Consent","owner":"Privacy / compliance","sensitivity":"Restricted","event":"consent.granted / revoked"},{"entity":"KYC / AML / sanctions","attributes":"verification, screening refs, risk status, exception, review date","source":"KYC / AML providers","sor":"Core Trust status","owner":"Compliance","sensitivity":"Restricted","event":"screening.completed"},{"entity":"Income / employment","attributes":"salary, employer, tenure, income frequency, proof, verification status","source":"Borrower, employer, payroll/data provider","sor":"Loan financial evidence store","owner":"Underwriting","sensitivity":"Restricted / Financial","event":"income.verified"},{"entity":"Bank statements / cashflow","attributes":"account ref, period, inflows/outflows, recurring obligations, source, consent","source":"Bank / open banking / uploaded files","sor":"Loan data store / source evidence","owner":"Underwriting","sensitivity":"Restricted / Financial","event":"financial_data.received"},{"entity":"Liabilities / credit","attributes":"credit obligations, bureau score, delinquencies, utilization, inquiry refs","source":"Credit bureau / borrower","sor":"Credit data record","owner":"Risk / lender","sensitivity":"Restricted / Financial","event":"credit_data.updated"},{"entity":"Collateral property","attributes":"property_ref, title, owner, type, location, encumbrances, status, security","source":"Borrower, registry","sor":"Real Estate Asset Registry + collateral link","owner":"Collateral operations","sensitivity":"Restricted","event":"collateral.verified"},{"entity":"Valuation / inspection","attributes":"value, currency, date, methodology, condition, comparables, valuer","source":"Valuer / data provider","sor":"Valuation record","owner":"Risk / collateral","sensitivity":"Confidential","event":"valuation.received"},{"entity":"Risk / underwriting decision","attributes":"score, LTV, DTI, affordability, policy rules, exception, authority, decision, rationale","source":"Financial data, policy, underwriter","sor":"Decision case / policy engine","owner":"Credit risk","sensitivity":"Restricted","event":"underwriting.decided"},{"entity":"Loan product / offer","attributes":"rate, fees, term, amortization, product, conditions, expiry, version","source":"Lender","sor":"Product & offer record","owner":"Product owner","sensitivity":"Confidential","event":"offer.issued / accepted"},{"entity":"Contract / security","attributes":"agreement version, signatures, security/lien, insurance, registration, conditions","source":"Legal / borrower / registry","s ollateral release have controlled states and audit trails."]},{"id":4,"name":"Strategic Real Estate Capital / Market Making","short":"Strategic Capital","tag":"Allocation, market making","scope":"Manage strategic capital mandates and allocations into property assets, development projects and property vehicles; support permitted pricing, quoting, order/trade execution and liquidity for eligible property-backed instruments through authorized partners.","title":"Strategic Real Estate Capital / Market Making","purpose":"Manage strategic capital mandates and allocations into approved real estate assets, development projects, property vehicles and property-backed investment instruments. Support acquisition/deployment decisions, property valuation and cashflow analysis, and, where legally permitted, pricing, quoting, order/trade execution, inventory, settlement, risk and reporting for eligible property-backed instruments.","boundary":"The capital mandate, property pipeline, investment allocation, portfolio risk and liquidity workflows are real-estate-specific capabilities. REOS supplies identity, compliance, property references, wallet, ledger, payment, settlement, audit and data services. External banks, custodians, authorized venues, market makers and liquidity counterparties connect through controlled adapters. Physical property ownership transfers through the applicable legal conveyance and registry process; market-making applies only to eligible financial instruments. This document does not assume Amlaak itself is a licensed market maker.","interp":"the investable universe is limited to direct property, development projects, property-holding vehicles, property funds and eligible property-backed instruments. Physical property sales and title transfers follow legal conveyance and registry processes; only approved financial instruments may enter a quoting or market-making workflow.","stakeholders":[{"role":"Strategic capital provider / allocator","goal":"Defines mandate, capital budget, objectives, restrictions, and approves allocations.","touchpoints":"Mandate, commitment, allocation, performance","system":"Capital mandate / treasury module","data":"Capital source, limits, target allocation","access":"Confidential / Financial"},{"role":"Issuer / asset owner / sponsor","goal":"Supplies instruments/assets, terms, disclosures, cashflows and requests capital/liquidity.","touchpoints":"Asset/instrument onboarding, financing, liquidity","system":"Issuer / asset registry","data":"Asset, instrument, terms, financials","access":"Confidential"},{"role":"Investment committee / treasury","goal":"Approves capital allocation, risk budgets, concentration and liquidity policies.","touchpoints":"Decision, allocation, exposure review","system":"Workflow / capital module","data":"Mandate, risk, portfolio, approval","access":"Restricted"},{"role":"Market maker / liquidity provider","goal":"Quotes bid/ask, manages inventory and executes within mandate and limits.","touchpoints":"Market-making, quoting, order, trade, position","system":"Market operations module","data":"Instrument, price, quote, inventory, exposure","access":"Financial"},{"role":"Broker / trading venue / exchange","goal":"Routes or matches orders, reports execution and market data.","touchpoints":"Order routing, trade execution, market data","system":"External venue adapter","data":"Order, trade, quote, venue status","access":"Financial"},{"role":"Custodian / wallet / settlement bank","goal":"Safeguards assets/cash, confirms balances and settles trades.","touchpoints":"Funding, custody, settlement, reconciliation","system":"Core Wallet/Payment/Settlement + partner","data":"Cash, token/asset position, settlement ref","access":"Financial / Restricted"},{"role":"Market data / oracle / pricing provider","goal":"Provides price, NAV, rates, reference and valuation data.","touchpoints":"Market data ingest, pricing, valuation","system":"Data services / provider adapter","data":"Price, timestamp, source, confidence","access":"Internal / Confidential"},{"role":"Risk / compliance / surveillance","goal":"Monitors limits, conflicts, market conduct, concentration, AML and exceptions.","touchpoints":"Pre-trade checks, monitoring, escalation","system":"Core Trust + Capital Risk","data":"Risk exposure, activity, parties, alerts","access":"Restricted"},{"role":"Finance / operations / reconciler","goal":"Reconciles capital, orders, trades, cash, positions, fees and P&L.","touchpoints":"Settlement, reconciliation, accounting","system":"Ledger / operations","data":"Trade, ledger, bank, position, fee","access":"Financial"},{"role":"Regulator / auditor / governance","goal":"Receives approved records and evidence; oversees permissions and controls.","touchpoints":"Reporting, audit, surveillance evidence","system":"Reporting / audit","data":"Mandate, approvals, trade, risk, logs","access":"Restricted"}],"journey":[{"stage":"Mandate setup","actor":"Capital provider / allocator","action":"Define capital source, objectives, horizon, eligible instruments/assets, risk and liquidity limits.","services":"Capital Mandate, Rules, Organization","io":"Mandate, commitments, restrictions","control":"Authority and mandate version approved."},{"stage":"Capital onboarding","actor":"Treasury / compliance","action":"Verify capital entity, source of funds, account/custody and permissions.","services":"IAM, KYB, AML, Wallet/Accounts","io":"Capital source, KYC, account, funding status","control":"Compliance and funding checks; segregated accounts/ledger."},{"stage":"Asset / instrument intake","actor":"Issuer / asset team","action":"Create asset/instrument record, terms, valuation, disclosure and eligibility.","services":"Asset Registry, Product, Documents","io":"Instrument, asset, terms, pricing source","control":"Instrument approved and operationally enabled."},{"stage":"Allocation & approval","actor":"Allocator / investment committee","action":"Propose deployment, allocation, target exposu igible tokenized property interests, subject to the approved legal structure. Fund units, property tokens and registered title must remain distinct and reconciled records.","interp":"a fund may hold direct property, shares/interests in a property SPV or eligible tokenized property interests. The fund investor register, underlying property title record and token register must remain separate and be reconciled under the fund's approved legal and accounting model.","stakeholders":[{"role":"Fund manager / GP / product owner","goal":"Creates product, investment strategy, terms, portfolio, approvals and lifecycle decisions.","touchpoints":"Product setup, allocation, portfolio, valuation, distributions, reporting","system":"Fund module / product record","data":"Fund, terms, portfolio, fees, decisions","access":"Confidential / Financial"},{"role":"Issuer / fund / SPV / trustee","goal":"Provides legal vehicle, governance, rights and authorized sign-off.","touchpoints":"Entity setup, approvals, legal documents, corporate actions","system":"Organization / fund record","data":"Entity, legal structure, authority, governance","access":"Restricted"},{"role":"Investor / LP / shareholder","goal":"Reviews product, verifies eligibility, subscribes, holds, receives reporting and redeems/transfers.","touchpoints":"Investor onboarding, subscription, statements, redemption","system":"Investor register / Core Identity","data":"Identity, suitability, commitments, holdings, cashflows","access":"Restricted / Financial"},{"role":"Distributor / wealth advisor / broker","goal":"Introduces investors, supports product disclosure/suitability and tracks distribution.","touchpoints":"Marketing, referral, subscription support, commissions","system":"Distribution CRM / product module","data":"Investor lead, product, consent, referral","access":"Confidential"},{"role":"Fund administrator / transfer agent","goal":"Maintains investor register, capital accounts, NAV calculations, subscriptions/redemptions
