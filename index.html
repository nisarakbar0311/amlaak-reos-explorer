n.","NAV input missing or outlier: valuation exception, review and approved NAV correction/versioning.","Distribution or redemption liquidity/gate exception: hold or partially process according to approved fund terms; reconcile register and cash."],"kpis":["Investor onboarding time","Subscription processing time","Allocation/register reconciliation breaks","NAV cycle time and correction rate","Fee calculation accuracy","Distribution on-time rate","Redemption processing time","Investor report delivery SLA"],"lifecycle":[{"t":"Product / fund terms","s":"Fund, class, legal terms"},{"t":"Investor & eligibility","s":"Investor, KYC, eligibility"},{"t":"Subscription / capital","s":"Commitment, order, funding"},{"t":"Allocation / register","s":"Units, register, capital account"},{"t":"Portfolio / NAV","s":"Assets, values, cash, NAV"},{"t":"Fees / distributions","s":"Fees, calls, distribution"},{"t":"Redemption / transfer","s":"Gate, price, transfer"},{"t":"Statements / audit","s":"Statements, audit, access"}],"datapoints":[{"entity":"Fund / product / legal vehicle","attributes":"fund_id, product_id, legal entity, strategy, jurisdiction, class, term, status","source":"Fund manager / legal","sor":"Fund product registry","owner":"Product owner","sensitivity":"Confidential","event":"fund.approved / product.published"},{"entity":"Class / terms / economics","attributes":"class_id, currency, min, fee, hurdle, redemption, lockup, NAV frequency, rights, version","source":"Fund manager / legal","sor":"Product terms","owner":"Product owner / legal","sensitivity":"Confidential","event":"terms.versioned"},{"entity":"Underlying assets / holdings","attributes":"asset_ref, units, acquisition cost, ownership, market value, income, expense, risk, status","source":"Asset manager / property systems","sor":"Portfolio/holdings record + Asset Registry","owner":"Portfolio manager","sensitivity":"Confidential / Financial","event":"holding.updated"},{"entity":"Investor / account","attributes":"inves r","owner":"Fund finance","sensitivity":"Financial","event":"fee.calculated"},{"entity":"Distribution / corporate action","attributes":"gross/net, source income, allocation basis, investor amount, tax/withholding if applicable, payment status","source":"Asset manager / fund admin","sor":"Distribution record + Payment","owner":"Fund operations","sensitivity":"Financial","event":"distribution.approved / paid"},{"entity":"Transfer / redemption","attributes":"request, units, pricing date, gates/lockup, fees, approval, settlement, status","source":"Investor / fund rules","sor":"Transfer/redemption case","owner":"Transfer agent","sensitivity":"Financial / Restricted","event":"redemption.accepted / completed"},{"entity":"Statement / reporting","attributes":"period, investor, holdings, NAV, transactions, performance, disclosures, report version","source":"Fund accounting / reporting","sor":"Reporting/document service","owner":"Fund admin","sensitivity":"Restricted","event":"statement.published"},{"entity":"Custody / cash / reconciliation","attributes":"custodian balance, bank balance, ledger, asset position, breaks, resolution, timestamps","source":"Custodian / bank / Core OS","sor":"Ledger / reconciliation","owner":"Operations / finance","sensitivity":"Financial / Restricted","event":"reconciliation.completed"},{"entity":"Governance / audit","attributes":"approvals, terms versions, valuation evidence, calculations, exceptions, access, events","source":"All process events","sor":"Audit / document store","owner":"Compliance / audit","sensitivity":"Restricted","event":"audit.recorded"}],"controls":["Fund terms, investor eligibility and distribution permissions are versioned and approved before launch.","Investor register, capital accounts, cash, holdings and tokenized positions reconcile.","NAV is calculated under a documented methodology, reviewed and approved; valuation exceptions are traceable.","Capital calls, fees, distributions and redemption gates are calculated from a asses":[{"cls":"Public","examples":"Published listing fields, approved offering summary, public product information","controls":"Publication approval, accuracy/freshness, content rights, no private identifiers."},{"cls":"Internal","examples":"Workflow statuses, operational metrics, non-public configuration","controls":"Authenticated access, role-based permissions, audit."},{"cls":"Confidential","examples":"Commercial terms, asset financials, valuation, partner contracts, investment strategy","controls":"Need-to-know, tenant/organization boundaries, encryption, export controls."},{"cls":"Restricted / PII","examples":"Identity, beneficial owners, KYC evidence, consent, credit, bank statements, screening results","controls":"Strong access controls, purpose limitation, minimization, retention, privacy review, encryption and auditable access."},{"cls":"Financial / transaction","examples":"Subscriptions, balances, loans, orders, trades, payments, holdings, fees, distributions","controls":"Segregation of duties, integrity, reconciliation, immutable/append-only evidence where appropriate, restricted exports."},{"cls":"Regulatory / audit evidence","examples":"Approvals, decision rationale, exceptions, surveillance, audit trail, regulatory reporting","controls":"Retention policy, integrity, access logs, provenance, controlled correction/versioning."}],"raci":[{"activity":"Business requirements, product terms and outcome KPIs","A":"Business/Product Owner","R":"Product / REOS Real Estate Services","ops":"Operations","core":"Core OS Architecture","control":"Compliance/Risk"},{"activity":"Stakeholder and access role definition","A":"Product Owner","R":"IAM / Application Owner","ops":"Operations","core":"Core OS IAM","control":"Compliance/Risk"},{"activity":"Property data / registry verification","A":"REOS Real Estate Services Owner","R":"Registry Integration","ops":"Asset/Listing/Lending Ops","core":"Integration Framework","control":"Legal/Compliance"},{"activity":"KYC/KYB/AML and eligibility","A":"Compliance Owner","R":"Application Policy","ops":"Onboarding Ops","core":"Core Trust","control":"Compliance/Risk"},{"activity":"Journey workflow and case state","A":"Application Owner","R":"Orchestration / Workflow","ops":"Case Operations","core":"Core OS","control":"Compliance/Risk"},{"activity":"Wallet / ledger / payment / settlement","A":"Finance / Transaction Owner","R":"Application Domain","ops":"Finance Ops","core":"Core OS Transaction Services","control":"Compliance/Risk"},{"activity":"Token issuance / smart contract","A":"Tokenized Property Product Owner","R":"Tokenization Services","ops":"Issuer/Transfer Ops","core":"Digital Asset Architecture","control":"Legal/Compliance"},{"activity":"Credit decision / underwriting","A":"Lender / Credit Owner","R":"Lending Module","ops":"Underwriting Ops","core":"Rules/Data Services","control":"Credit Risk"},{"activity":"Order/trade/market-making controls","A":"Real Estate Capital & Liquidity Owner","R":"Market Ops Module","ops":"Trading Operations","core":"Core OS + Integration","control":"Risk/Compliance"},{"activity":"Fund accounting / NAV / register","A":"Fund Manager / Admin","R":"REOS Fund Management Application","ops":"Fund Ops / Transfer Agent","core":"Core Ledger / Data","control":"Compliance/Audit"},{"activity":"External partner integration","A":"Integration Owner","R":"Partner Adapter","ops":"Partner Operations","core":"API/Event Standards","control":"Security/Compliance"},{"activity":"Data quality / classification / retention","A":"Domain Data Owner","R":"Data Governance","ops":"Data Steward","core":"Core Data Services","control":"Privacy/Compliance"},{"activity":"Audit / reporting / exception management","A":"Business Control Owner","R":"Application","ops":"Operations","core":"Core Audit/Reporting","control":"Compliance/Audit"}],"raciNote":"This is a proposed ownership baseline for internal alignment. A single accountable role must be named per workstream and per regulated product; actual organization titles and partner responsibilities will be confirmed.","decisions":[{"area":"Tokenized property","q":"Legal form and rights represented by token; issuer/SPV structure; official ownership/title relationship; transfer restrictions; investor segments; custody and chain; subscription, distributions and redemption policy."},{"area":"Property portal","q":"Is scope discovery/leads only, or also offer, reservation, transaction execution and brokerage operations? Listing authority and verification sources; freshness SLA; monetization/referral rules; consent and partner handoff."},{"area":"Lending OS","q":"Initial products (mortgage, developer finance, bridge/secured lending); lender-of-record; credit decision ownership; underwriting policies and delegated authorities; data-provider permissions; servicing/collections scope."},{"area":"Strategic capital / market making","q":"Property and development asset mandate; direct property allocation vs property-backed instruments; capital source; eligible tokenized interests; authorized venue/OTC activity; quote and inventory controls; risk limits; settlement model and market-conduct boundaries."},{"area":"Investment products & fund management","q":"Property fund/SPV/product types; manager, administrator, trustee/custodian and transfer-agent roles; investor segments; property mandate; classes/terms; NAV and valuation policy; capital calls/distributions; redemption gates; direct property vs tokenized interests."},{"area":"Cross-business","q":"Master identity/organization strategy; source-of-truth data ownership; tenant/client segregation; data residency and retention; consent; API/event standards; partner SLA; exception operations; KPI definitions."},{"area":"Day-1 implementation","q":"Select first journey per business case or initial subset; prioritize by partner readiness, revenue/traction, integration complexity and shared Core OS dependency. Do not infer full scope equals Day-1 build."}],"workshops":[{"name":"1. Business model & scope confirmation","who":"Business owners, product, commercial, client representatives","output":"Definition, scope boundaries, primary users, exclusions, success measures for each of the five cases."},{"name":"2. Stakeholder / permissions","who":"Product, operations, compliance, architecture, partner owners","output":"Named actors, roles, delegated authority, access model, RACI and handoffs."},{"name":"3. Journey walkthroughs","who":"Business owners, operations, UX, architecture, partners","output":"Step-by-step journeys, exceptions, SLA, approvals, acceptance criteria."},{"name":"4. Data & source-of-truth","who":"Data owners, integrations, compliance, architecture","output":"Entity catalog, required/optional fields, authoritative sources, classification, retention, API/event mapping."},{"name":"5. Day-1 scope & dependency","who":"Leadership, product, commercial, delivery, architecture","output":"Prioritized starting bundle, partner readiness, dependency graph and phased roadmap."},{"name":"6. Technical/operational validation","who":"Architecture, security, operations, vendors","output":"Controls, NFRs, integrations, runtime, monitoring, recovery and production readiness."}],"glossary":[{"term":"Core OS","meaning":"Shared platform services and technical foundations used by the five Amlaak real-estate business cases."},{"term":"REOS Real Estate Services / Module","meaning":"Real-estate-specific models, rules, integrations and services within Amlaak REOS."},{"term":"Application / Journey","meaning":"User-facing real-estate process that composes REOS services and shared platform capabilities."},{"term":"Source of Truth (SoR)","meaning":"System/record owner responsible for the authoritative business record; external authority may remain source for official status."},{"term":"Ledger","meaning":"Internal accounting/transaction record, distinct from blockchain."},{"term":"Tokenization","meaning":"Digital representation and lifecycle management of approved rights/assets under configured legal and transfer rules."},{"term":"NAV","meaning":"Net Asset Value calculated under a fund’s approved valuation/accounting methodology."},{"term":"Market Making","meaning":"Liquidity activity involving quotes, inventory and execution subject to mandate, controls and applicable rules."},{"term":"RACI","meaning":"Responsible, Accountable, Consulted, Informed role assignment."},{"term":"ZKP / selective disclosure","meaning":"Privacy technology used where it adds value to prove a condition without exposing unnecessary underlying data; not a replacement for access control."}],"assumptions":["The five business cases are treated as the selected Amlaak real-estate scope; detailed product variants, legal structures, regulatory status and accountable operating entities are not yet finalized.","UAE/Dubai references such as DLD, RERA and Dubai REST are based on the Amlaak meeting context and require confirmation of available APIs, authorization, data fields, permitted use and operational rules.","Roles such as fund administrator, transfer agent, custodian, market maker, lender, issuer, broker and asset servicer may be internal or external depending on Amlaak's approved operating model and applicable authorization.","Field examples are candidate real-estate data points, not a finalized API schema or mandatory field list. Required fields, data types, validation rules, retention and privacy basis must be approved by the relevant data owners.","User journeys represent target-state real-estate process flows. Day-1 scope, sequencing, partner contracts, technology choices and acceptance criteria remain separate decisions."],"rolloutIntro":"The November 20 Amlaak meeting minutes record a request for concrete Day-1 readiness, phased implementation, defined stakeholder roles and clear deliverables. The following is a proposed real-estate-only sequence for discussion. It is not a confirmed commitment; the final starting bundle depends on Amlaak's preferred anchor service, partner readiness, regulatory model, data access and delivery capacity.","rollout":[{"stage":"Day-1 foundation","outcome":"A controlled real-estate operating baseline.","capabilities":"Identity and organizations; property master; documents; workflow/case management; API/integration; audit; notifications; reporting; role access.","deliverables":"Admin and partner access; property intake; verification case; evidence repository; controlled listing workflow; operational dashboard.","deps":"Named data owners; approved property data model; access roles; security controls; initial property-data sources and partner onboarding process."},{"stage":"Phase 1: Property discovery","outcome":"Launch a real-estate front door that acquires inventory and qualified demand.","capabilities":"Listing management; search; media; lead/consent; broker/developer portal; property verification connectors; CRM and communications.","deliverables":"Property Portal; verified listing workflow; enquiries; lead routing; viewing scheduling; sale/rent/investment handoff.","deps":"Inventory sources; listing rules; consent language; broker/developer onboarding; lead ownership and response SLAs."},{"stage":"Phase 2: Property finance and tokenization","outcome":"Enable controlled financial journeys around selected properties or property vehicles.","capabilities":"KYC/KYB/AML; eligibility; valuation/diligence; wallet/ledger; payments/escrow; settlement; e-sign; tokenization and investor-register reconciliation; lending integration.","deliverables":"One selected tokenized-property pilot and one lender/mortgage integration path, subject to legal and partner approval.","deps":"Legal rights and issuer/lender roles confirmed; approved asset; partner contracts; registry access; payment/custody design; compliance sign-off."},{"stage":"Phase 3: Capital and fund operations","outcome":"Scale into repeatable property capital deployment and investment portfolio operations.","capabilities":"Capital mandate/allocation; portfolio and risk; pricing/quotes; authorized venue adapters; fund accounting/NAV; transfer agent; distributions and redemption.","deliverables":"Strategic Real Estate Capital & Market Making; Real Estate Investment Products & Fund Management; consolidated property/investor reporting.","deps":"Authorized manager, administrator, custodian and liquidity provider identified; valuation policy; liquidity rules; governance and settlement controls."}],"bundle":["Property identity and master reference with title/registry references and verification evidence.","Owner, developer, broker and internal-operator identity with role-based access.","Property/listing intake, verification case, document repository and approval workflow.","Lead capture, consent, assignment, notification and response tracking.","Partner API gateway, source/timestamp tracking, integration monitoring and audit trail.","Operational reporting for inventory, verification status, lead conversion and unresolved exceptions."],"mmGuardrail":"The market-making component must be scoped to eligible property-backed financial instruments and delivered through appropriately authorized entities. It must not be presented as automated trading of physical property title. Physical property sales, conveyance and title registration remain governed by the applicable legal and registry process."}</script>
<script>
{

/* pages and routing */

 {id:'overview',label:'Overview',ico:'home',g:'Documentation'},

 {id:'stakeholders',label:'Stakeholder map',ico:'users',g:'Documentation'},

const tocMap=['architecture','stakeholders','bc1','data','governance','reference'];
const pOverview=()=>head(`${I('home','ico')}Amlaak Real Estate Operating System`,'Overview','Stakeholder mapping, user journeys and data architecture for five connected real-estate business cases built on one Amlaak REOS foundation.')+
 `<section class="sec"><div class="metrics">${[[5,'Business cases','bc1'],[nSt,'Stakeholder roles','bc1-stakeholders'],[nJ,'Journey stages','bc1-journey'],[nD,'Data points','bc1-data'],[D.domains.length,'Shared data domains','data']].map(([n,l,h])=>`<a href="#${h}"><b>${n}</b><span>${l}</span></a>`).join('')}</div></section>
 <section class="sec"><div class="sh"><h2>Platform structure</h2><p>Five business applications on one Core OS. Select an application to open its business case.</p></div>
 <div class="stackd"><div class="apps">${C.map(c=>`<a class="appc" href="#bc${c.id}"><span class="t"><span class="bcn">BC${c.id}</span>${I(BCI[c.id])}</span><h3>${esc(c.short)}</h3><p>${esc(c.tag)}</p></a>`).join('')}</div>

 <div class="props"><div class="pk">${I('target')}Operating scope</div><div class="pv">${esc(c.scope)}</div><div class="pk">${I('layers')}Architecture boundary</div><div class="pv">${esc(c.boundary)}</div>${c.interp?`<div class="pk">${I('shield')}Real-estate-only interpretation</div><div class="pv">${esc(c.interp)}</div>`:''}</div>

 <div id="sub" role="tabpanel" aria-labelledby="tab-${st.tab}">${st.tab==='stakeholders'?tStake(c):st.tab==='journey'?tJourney(c):tData(c)}</div>`};

 <div class="shg"><div class="rows"><div class="rh g-sh"><span>Stakeholder / role</span><span>Access class</span><span>Primary system / record</span><span></span></div>
 ${list.map(s=>`<div class="ri${st.open===s.i?' open':''}" id="sh-${c.id}-${s.i}"><button type="button" class="rb g-sh" data-open="${s.i}" aria-expanded="${st.open===s.i}"><span class="k">${esc(s.role)}</span><span class="tgs">${sens(s.access)}</span><span class="v hide">${esc(s.system)}</span>${I('chev','ico chev')}</button>

 ${['P','S','I','R','-'].map(k=>{const g=grp(k);return g.length?`<div class="grp"><div class="gh">${cell(k)}${k==='-'?'Not involved':LEG[k]} <span class="muted">${g.length}</span></div><ul>${g.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}).join('')}</aside></div>`};

 const top=`<div class="tools"><span class="muted" style="font-size:13.5px">${J.length} stages in the primary user journey</span><span class="count"></span><div class="seg" role="group" aria-label="Journey view"><button type="button" data-jv="map" aria-pressed="${st.jv==='map'}">Journey map</button><button type="button" data-jv="table" aria-pressed="${st.jv==='table'}">Table</button></div></div>`;

 <div class="panel"><h3>${I('gauge')}Operational KPIs</h3><ul class="kpi">${c.kpis.map(x=>`<li>${I('gauge')}${esc(x)}</li>`).join('')}</ul></div></div>`;
 if(st.jv==='table')return top+`<div class="tw"><table class="stack"><thead><tr><th>Stage</th><th>Actor</th><th>User / business action</th><th>Platform services / records</th><th>Data inputs / outputs</th><th>Control / decision / outcome</th></tr></thead><tbody>${J.map((r,i)=>`<tr><td class="k" data-l="Stage">${i+1}. ${esc(r.stage)}</td><td data-l="Actor">${esc(r.actor)}</td><td data-l="Action">${esc(r.action)}</td><td data-l="Services">${esc(r.services)}</td><td data-l="Data in / out">${esc(r.io)}</td><td data-l="Control">${esc(r.control)}</td></tr>`).join('')}</tbody></table></div>`+extra;
 return top+`<div class="jg"><ol class="steps" role="tablist" aria-label="Journey stages" aria-orientation="vertical">${J.map((r,i)=>`<li class="${i<k?'done':''}"><button type="button" role="tab" class="st" data-stage="${i}" aria-selected="${i===k}" tabindex="${i===k?0:-1}" aria-controls="stagePanel"><span class="num">${i+1}</span><span><b>${esc(r.stage)}</b><small>${esc(r.actor)}</small></span></button></li>`).join('')}</ol>
 <article class="panel sd" id="stagePanel" role="tabpanel" aria-live="polite"><div class="sd-h"><div><div class="pos">Stage ${k+1} of ${J.length}</div><h2>${esc(s.stage)}</h2></div><div class="pn"><button type="button" class="ibtn" data-step="-1" aria-label="Previous stage" ${k===0?'disabled':''}>${I('left')}</button><button type="button" class="ibtn" data-step="1" aria-label="Next stage" ${k===J.length-1?'disabled':''}>${I('right')}</button></div></div>
 <div class="props"><div class="pk">${I('user')}Actor</div><div class="pv">${esc(s.actor)}</div><div class="pk">${I('route')}User / business action</div><div class="pv" style="color:var(--ink)">${esc(s.action)}</div>
 <div class="pk">${I('layers')}Platform services / records</div><div class="pv"><div class="pills">${splitList(s.services).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>
 <div class="pk">${I('io')}Data inputs / outputs</div><div class="pv"><div class="pills">${splitList(s.io).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>
 <div class="pk ctl">${I('shield')}Control / decision / outcome</div><div class="pv ctl">${esc(s.control)}</div></div></article></div>`+extra};

const tData=c=>{const sv=[...new Set(c.datapoints.flatMap(d=>parts(d.sensitivity)))];
 return `<div class="sec"><div class="sh"><h2>Data lifecycle and point map</h2><p>Data captured, validated, transformed and persisted at each stage.</p></div>
 <div class="flow">${c.lifecycle.map((l,i)=>`<div class="fn"><span class="i">${i+1}</span><b>${esc(l.t)}</b><span>${esc(l.s)}</span></div>`).join('')}</div>
 <div class="sharedsvc">Shared services${['Identity','Compliance','Workflow','Documents','Ledger','Payments','Settlement','Audit','API / Events'].map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>
 <div class="sec"><div class="sh"><h2>Data point catalogue</h2></div>
 <div class="tools"><label class="inp">${I('search')}<span class="sr">Filter data points</span><input type="search" id="dpq" placeholder="Filter by entity, attribute, owner or event" value="${esc(st.q)}"></label>${sv.map(a=>`<button type="button" class="fbtn" data-sens="${esc(a)}" aria-pressed="${st.sens===a}"><span class="dot d-${esc(a.toLowerCase())}"></span>${esc(a)}</button>`).join('')}<span class="count" id="dpCount"></span></div>
 <div class="rows" id="dplist"><div class="rh g-dp"><span>Data entity / point</span><span>Sensitivity</span><span>Business event</span><span>Data owner</span><span></span></div>
 ${c.datapoints.map((d,i)=>`<div class="ri${st.dopen===i?' open':''}" id="dp-${c.id}-${i}" data-i="${i}"><button type="button" class="rb g-dp" data-dopen="${i}" aria-expanded="${st.dopen===i}"><span class="k">${esc(d.entity)}</span><span class="tgs">${sens(d.sensitivity)}</span><span class="tgs hide">${parts(d.event).map(x=>`<code>${esc(x)}</code>`).join('')}</span><span class="v hide">${esc(d.owner)}</span>${I('chev','ico chev')}</button>
 <div class="rx"><div><div class="in"><div class="w"><div class="lab">Key attributes (examples)</div><div class="pills">${d.attributes.split(',').map(x=>`<code>${esc(x.trim())}</code>`).join('')}</div></div><div><div class="lab">Source</div><p>${esc(d.source)}</p></div><div><div class="lab">System of record / storage</div><p>${esc(d.sor)}</p></div><div><div class="lab">Data owner</div><p>${esc(d.owner)}</p></div><div><div class="lab">Business event</div><p>${esc(d.event)}</p></div></div></div></div></div>`).join('')}
 <p class="empty" id="dpEmpty" hidden>No data points match this filter. Clear it to see all ${c.datapoints.length}.</p></div></div>
 <div class="sec"><div class="sh"><h2>Data controls and source-of-truth rules</h2></div><ul class="ctrl">${c.controls.map(x=>`<li>${I('shield')}<p>${esc(x)}</p></li>`).join('')}</ul></div>`};
const filterDP=()=>{const c=C[+st.page.slice(2)-1],q=st.q.toLowerCase().trim();let n=0;
 $$('#dplist .ri').forEach(el=>{const d=c.datapoints[+el.dataset.i];const ok=(!q||Object.values(d).join(' ').toLowerCase().includes(q))&&(!st.sens||parts(d.sensitivity).includes(st.sens));el.hidden=!ok;if(ok)n++});
 const ce=$('#dpCount');if(ce)ce.textContent=`${n} of ${c.datapoints.length} data points`;const e=$('#dpEmpty');if(e)e.hidden=n>0};

/* shared data */
const pData=()=>head(`${I('db')}Section 9`,'Shared real estate data architecture','The property, party and transaction domains every application reuses, the rules for which record is authoritative, and how each class of data is protected.')+
 `<section class="sec"><div class="sh"><h2>Shared real-estate data domains</h2></div><div class="tw"><table class="stack"><thead><tr><th>Data domain</th><th>Proposed owner / system</th><th>Reuse and key data</th></tr></thead><tbody>${D.domains.map((d,i)=>`<tr id="dom-${i}"><td class="k" data-l="Domain">${esc(d.domain)}</td><td data-l="Owner / system">${esc(d.owner)}</td><td data-l="Reuse and key data">${esc(d.data)}</td></tr>`).join('')}</tbody></table></div></section>
 <section class="sec"><div class="sh"><h2>Source-of-truth principles</h2></div><div class="dl">${D.sot.map(s=>`<div><b>${esc(s.k)}</b><p>${esc(s.v)}</p></div>`).join('')}</div></section>
 <section class="sec"><div class="sh"><h2>Data classification</h2></div><div class="tw"><table class="stack"><thead><tr><th>Class</th><th>Examples</th><th>Controls</th></tr></thead><tbody>${D.classes.map((c,i)=>`<tr id="cls-${i}"><td class="k" data-l="Class"><span class="badge"><span class="dot d-${esc(parts(c.cls)[0].toLowerCase())}"></span>${esc(c.cls)}</span></td><td data-l="Examples">${esc(c.examples)}</td><td data-l="Controls">${esc(c.controls)}</td></tr>`).join('')}</tbody></table></div></section>`;

/* governance */
const pGov=()=>head(`${I('table')}Sections 10 to 12`,'Ownership, decisions and validation','The proposed RACI baseline, the decisions Amlaak should confirm before detailed design, and the recommended workshop sequence.')+
 `<section class="sec"><div class="sh"><h2>Proposed real estate RACI / ownership matrix</h2></div><div class="tw"><table class="stack raci"><thead><tr><th>Activity</th><th>Accountable (A)</th><th>Responsible (R)</th><th>Operational role</th><th>Core platform role</th><th>Control role</th></tr></thead><tbody>${D.raci.map((r,i)=>`<tr id="raci-${i}"><td class="k" data-l="Activity">${esc(r.activity)}</td><td data-l="Accountable">${esc(r.A)}</td><td data-l="Responsible">${esc(r.R)}</td><td data-l="Operational">${esc(r.ops)}</td><td data-l="Core platform">${esc(r.core)}</td><td data-l="Control">${esc(r.control)}</td></tr>`).join('')}</tbody></table></div>
 <div class="note" style="margin-top:12px">${I('info')}<p><b>RACI interpretation.</b> ${esc(D.raciNote)}</p></div></section>
 <section class="sec"><div class="sh"><h2>Amlaak decisions to validate before detailed design</h2></div><div class="acc2">${D.decisions.map((d,i)=>{const q=d.q.split(/;\s*/);return `<div class="ri" id="dec-${i}"><button type="button" class="rb" data-dec aria-expanded="false"><span class="k">${esc(d.area)}</span><span class="badge">${q.length} items</span>${I('chev','ico chev')}</button><div class="rx"><div><ul>${q.map(x=>`<li>${esc(x.replace(/\.$/,''))}</li>`).join('')}</ul></div></div></div>`}).join('')}</div></section>
 <section class="sec"><div class="sh"><h2>Recommended validation workshop sequence</h2></div><ol class="wtl">${D.workshops.map((w,i)=>{const m=w.name.match(/^(\d+)\.\s*(.*)$/);return `<li id="ws-${i}"><span class="num">${m?m[1]:i+1}</span><div><h3>${esc(m?m[2]:w.name)}</h3><div class="pills">${w.who.split(',').map(x=>`<span class="pill">${esc(x.trim())}</span>`).join('')}</div><p><span class="muted">Output:</span> ${esc(w.output)}</p></div></li>`}).join('')}</ol></section>`;

/* rollout */
const pRoll=()=>head(`${I('cal')}Section 13`,'Day-1 readiness and indicative phased rollout',esc(D.rolloutIntro))+
 `<section class="sec"><div class="track" aria-hidden="true">${D.rollout.map(r=>`<span><i></i>${esc(r.stage.split(':')[0])}</span>`).join('')}</div>
 <div class="road">${D.rollout.map((r,i)=>{const m=r.stage.split(':');return `<article class="panel ph2" id="ro-${i}"><div class="hd">${m[1]?`<small>${esc(m[0])}</small>`:'<small>Baseline</small>'}<h3>${esc(m[1]?m[1].trim():r.stage)}</h3><p>${esc(r.outcome)}</p></div><div class="b"><div class="lab">Core capabilities</div><p>${esc(r.capabilities)}</p></div><div class="b"><div class="lab">Real-estate deliverables</div><p>${esc(r.deliverables)}</p></div><div class="b"><div class="lab">Dependencies / exit criteria</div><p>${esc(r.deps)}</p></div></article>`}).join('')}</div></section>
 <section class="sec"><div class="sh"><h2>Suggested Day-1 service bundle</h2></div><ul class="checks">${D.bundle.map(b=>`<li>${I('check')}<p>${esc(b)}</p></li>`).join('')}</ul></section>
 <section class="sec"><div class="note gold">${I('shield')}<p><b>Real estate market-making guardrail.</b> ${esc(D.mmGuardrail)}</p></div></section>`;

/* reference */
const pRef=()=>head(`${I('book')}Appendix`,'Glossary, assumptions and limitations','')+
 `<section class="sec"><div class="sh"><h2>Glossary</h2></div><div class="dl">${D.glossary.map((g,i)=>`<div id="gl-${i}"><b>${esc(g.term)}</b><p>${esc(g.meaning)}</p></div>`).join('')}</div></section>
 <section class="sec"><div class="sh"><h2>Assumptions and limitations</h2></div><ol class="asm">${D.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ol></section>`;

const R={overview:pOverview,architecture:pArch,stakeholders:pStake,data:pData,governance:pGov,rollout:pRoll,reference:pRef};
const render=(keep)=>{const v=$('#view');v.innerHTML=`<div class="page">${(R[st.page]||pBC)()}${pager()}</div>`;renderNav();renderCrumbs();
 document.title=(page().bc?'BC'+page().bc+' '+page().short:page().label)+' | Amlaak REOS Explorer';
 if(st.page.startsWith('bc')&&st.tab==='data')filterDP();if(!keep)scrollTo({top:0,behavior:'auto'})};
const reSub=()=>{const s=$('#sub');if(!s)return;const c=C[+st.page.slice(2)-1];s.innerHTML=st.tab==='stakeholders'?tStake(c):st.tab==='journey'?tJourney(c):tData(c);if(st.tab==='data')filterDP()};
const setHash=h=>{try{history.replaceState(null,'','#'+h)}catch(e){}};
const resetBC=()=>{st.stage=0;st.open=-1;st.dopen=-1;st.q='';st.sens=null;st.acc=null;st.jv='map'};
const fromHash=()=>{const h=location.hash.slice(1);let m=h.match(/^bc([1-5])(?:-(stakeholders|journey|data))?$/);
 if(m){const id='bc'+m[1];if(st.page!==id)resetBC();st.page=id;st.tab=m[2]||'journey';}
 else st.page=R[h]?h:'overview';
 render();closeNav()};
addEventListener('hashchange',fromHash);

/* interactions */
const view=$('#view');
view.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){st.tab=d.tab;setHash(st.page+'-'+d.tab);render(true);renderNav();return}
 if(d.stage){st.stage=+d.stage;reSub();if(innerWidth<960){const p=$('#stagePanel');if(p)p.scrollIntoView({block:'start',behavior:RM.matches?'auto':'smooth'})}return}
 if(d.step){st.stage+= +d.step;reSub();const f=$('.st[aria-selected=true]');if(f)f.focus({preventScroll:true});return}
 if(d.jv){st.jv=d.jv;reSub();return}
 if(d.acc!==undefined){st.acc=st.acc===d.acc?null:d.acc;st.open=-1;reSub();return}
 if(d.sens!==undefined){st.sens=st.sens===d.sens?null:d.sens;$$('[data-sens]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.sens===st.sens));filterDP();return}
 if(d.open!==undefined){const i=+d.open;st.open=st.open===i?-1:i;$$('#sub .ri').forEach(el=>{const b=el.querySelector('[data-open]');const on=+b.dataset.open===st.open;el.classList.toggle('open',on);b.setAttribute('aria-expanded',on)});return}
 if(d.dopen!==undefined||d.dec!==undefined){const el=t.parentElement,on=!el.classList.contains('open');el.classList.toggle('open',on);t.setAttribute('aria-expanded',on);if(d.dopen!==undefined)st.dopen=on?+d.dopen:-1;return}
 if(d.own){st.own=+d.own;$$('[data-own]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.own===d.own));$('#ownDetail').innerHTML=ownDetail(st.own);if(innerWidth<1100)$('#ownDetail').scrollIntoView({block:'nearest',behavior:RM.matches?'auto':'smooth'});return}
 if(d.av){st.av=d.av;render(true);return}
 if(d.mf){st.mxF=st.mxF===d.mf?null:d.mf;render(true);return}
 if(d.go){resetBC();st.page='bc'+d.go;st.tab='stakeholders';setHash(st.page+'-stakeholders');render()}});
view.addEventListener('input',e=>{if(e.target.id==='dpq'){st.q=e.target.value;filterDP()}});
const roving=(e,sel,keys)=>{if(!(e.key in keys))return;const items=$$(sel),i=items.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const n=keys[e.key]==='h'?0:keys[e.key]==='e'?items.length-1:Math.max(0,Math.min(items.length-1,i+keys[e.key]));items[n].click();requestAnimationFrame(()=>{const f=$$(sel)[n];if(f)f.focus()})};
view.addEventListener('keydown',e=>{if(e.target.closest('.tabs'))roving(e,'.tab',{ArrowRight:1,ArrowLeft:-1,Home:'h',End:'e'});else if(e.target.closest('.steps'))roving(e,'.st',{ArrowDown:1,ArrowUp:-1,Home:'h',End:'e'})});

/* mobile navigation */
const side=$('#side'),scrim=$('#scrim'),mb=$('#menuBtn');
const openNav=()=>{side.classList.add('open');scrim.classList.add('open');mb.setAttribute('aria-expanded','true');const a=side.querySelector('[aria-current=page]');(a||side.querySelector('a')).focus()};
function closeNav(){if(!side.classList.contains('open'))return;side.classList.remove('open');scrim.classList.remove('open');mb.setAttribute('aria-expanded','false')}
mb.addEventListener('click',openNav);scrim.addEventListener('click',closeNav);
addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});

/* deep links */
const flash=el=>{if(!el)return;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');el.scrollIntoView({block:'center',behavior:RM.matches?'auto':'smooth'})};
function go(t){
 if(t.bc){resetBC();st.page='bc'+t.bc;st.tab=t.tab;if(t.stage!==undefined)st.stage=t.stage;if(t.open!==undefined)st.open=t.open;if(t.dopen!==undefined)st.dopen=t.dopen;setHash(st.page+'-'+st.tab);render();
  const el=t.open!==undefined?$(`#sh-${t.bc}-${t.open}`):t.dopen!==undefined?$(`#dp-${t.bc}-${t.dopen}`):t.stage!==undefined?$('#stagePanel'):t.x?$('.jx'):null;if(el)requestAnimationFrame(()=>flash(el));return}
 st.page=t.page;if(t.own!==undefined){st.own=t.own;st.av='layers'}setHash(t.page);render();
 requestAnimationFrame(()=>{if(t.dec!==undefined){const el=$('#dec-'+t.dec);el.classList.add('open');el.querySelector('button').setAttribute('aria-expanded','true');flash(el)}else flash($('#'+t.el))})}

/* search */
const IDX=[];
C.forEach(c=>{const b='BC'+c.id+' '+c.short;
 c.stakeholders.forEach((s,i)=>IDX.push({ty:'Stakeholder',t:s.role,ctx:b,x:Object.values(s).join(' '),go:{bc:c.id,tab:'stakeholders',open:i}}));
 c.journey.forEach((s,i)=>IDX.push({ty:'Journey stage',t:`${i+1}. ${s.stage}`,ctx:b,x:Object.values(s).join(' '),go:{bc:c.id,tab:'journey',stage:i}}));
 c.datapoints.forEach((s,i)=>IDX.push({ty:'Data point',t:s.entity,ctx:b,x:Object.values(s).join(' '),go:{bc:c.id,tab:'data',dopen:i}}));
 c.exceptions.forEach(s=>IDX.push({ty:'Exception',t:s.split(':')[0],ctx:b,x:s,go:{bc:c.id,tab:'journey',x:1}}));
 c.kpis.forEach(s=>IDX.push({ty:'KPI',t:s,ctx:b,x:s,go:{bc:c.id,tab:'journey',x:1}}))});
D.ownership.forEach((r,i)=>IDX.push({ty:'Ownership',t:r.domain,ctx:r.layer,x:Object.values(r).join(' '),go:{page:'architecture',own:i,el:'own-'+i}}));
D.domains.forEach((r,i)=>IDX.push({ty:'Data domain',t:r.domain,ctx:r.owner,x:Object.values(r).join(' '),go:{page:'data',el:'dom-'+i}}));
D.classes.forEach((r,i)=>IDX.push({ty:'Data class',t:r.cls,ctx:'Data classification',x:Object.values(r).join(' '),go:{page:'data',el:'cls-'+i}}));
D.raci.forEach((r,i)=>IDX.push({ty:'RACI',t:r.activity,ctx:'Accountable: '+r.A,x:Object.values(r).join(' '),go:{page:'governance',el:'raci-'+i}}));
D.decisions.forEach((r,i)=>IDX.push({ty:'Decision',t:r.area,ctx:'Decisions to validate',x:r.q,go:{page:'governance',dec:i}}));
D.workshops.forEach((r,i)=>IDX.push({ty:'Workshop',t:r.name,ctx:'Validation sequence',x:Object.values(r).join(' '),go:{page:'governance',el:'ws-'+i}}));
D.rollout.forEach((r,i)=>IDX.push({ty:'Rollout',t:r.stage,ctx:r.outcome,x:Object.values(r).join(' '),go:{page:'rollout',el:'ro-'+i}}));
D.glossary.forEach((r,i)=>IDX.push({ty:'Glossary',t:r.term,ctx:r.meaning,x:r.term+' '+r.meaning,go:{page:'reference',el:'gl-'+i}}));
IDX.forEach(r=>r.lx=(r.x+' '+r.ctx+' '+r.t).toLowerCase());
const dlg=$('#dlg'),q=$('#q'),res=$('#res');let hits=[],sel=0;
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const mark=(s,terms)=>{let h=esc(s);terms.filter(t=>t.length>1).forEach(t=>{h=h.replace(new RegExp('('+reEsc(esc(t))+')','gi'),'<mark>$1</mark>')});return h};
const snip=(r,t)=>{const i=r.x.toLowerCase().indexOf(t);return i<0?null:(i>40?'…':'')+r.x.slice(Math.max(0,i-40),i+100)};
const search=()=>{const terms=q.value.toLowerCase().split(/\s+/).filter(Boolean);
 hits=terms.length?IDX.filter(r=>terms.every(t=>r.lx.includes(t))).sort((a,b)=>terms.some(t=>b.t.toLowerCase().includes(t))-terms.some(t=>a.t.toLowerCase().includes(t))).slice(0,60):[];sel=0;
 res.innerHTML=terms.length?(hits.map((r,i)=>{const s=snip(r,terms[0]);return `<li><button type="button" role="option" data-h="${i}" aria-selected="${i===0}"><b>${mark(r.t,terms)}</b><span class="ty">${esc(r.ty)}</span><small>${esc(r.ctx.length>40?r.ctx.slice(0,38)+'…':r.ctx)}${s?': '+mark(s,terms):''}</small></button></li>`}).join('')||`<li class="empty">No matches for "${esc(q.value)}". Try a single word such as "registry" or "NAV".</li>`):`<li class="empty">Search ${IDX.length} items across stakeholders, journey stages, data points, events, KPIs, ownership, RACI and the glossary.</li>`;
 $('#resCount').textContent=terms.length?`${hits.length}${hits.length===60?'+':''} results`:''};
const openS=()=>{if(dlg.open)return;closeNav();dlg.showModal();q.select();search()};
$$('[data-search]').forEach(b=>b.addEventListener('click',openS));
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
q.addEventListener('input',search);
const pick=i=>{const r=hits[i];if(!r)return;dlg.close();setTimeout(()=>go(r.go),40)};
res.addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b)pick(+b.dataset.h)});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!hits.length)return;sel=(sel+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;$$('#res [data-h]').forEach((b,i)=>{b.setAttribute('aria-selected',i===sel);if(i===sel)b.scrollIntoView({block:'nearest'})})}else if(e.key==='Enter'){e.preventDefault();pick(sel)}});
addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if((e.key==='/'&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openS()}});
if(/Mac|iPhone|iPad/.test(navigator.platform))$$('.sfind kbd').forEach(k=>k.textContent='⌘K');

fromHash();
}
</script>
</body>
</html>
